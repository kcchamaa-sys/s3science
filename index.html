<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7b7fd1">
<title>Chiikawa Physics Escape</title>
<meta name="description" content="A bite-sized, Chiikawa-themed escape room that teaches S3 Physics: Light & Optics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Yusei+Magic&family=Noto+Sans+HK:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --sky-top: #6f73c8;
  --sky-mid: #9c9be0;
  --sky-low: #d9d6f4;
  --bg: #f6f3fc;
  --surface: #ffffff;
  --surface-2: #f3effb;
  --bubble: #fff7f1;
  --ink: #4a3b3b;
  --ink-soft: #7d6c70;
  --line: #e4dcf0;
  --pink: #f7a9b8;
  --pink-deep: #e25f8a;
  --pink-press: #c94b75;
  --blue: #8fb0e0;
  --lav: #b9b6ea;
  --yellow: #f6df8c;
  --green: #4fae7f;
  --red: #dd5f58;
  --shadow: 0 8px 22px rgba(90, 70, 150, .12);
  --ray: #e25f8a;
  --normal: #7d6c70;
  --glass: rgba(143, 176, 224, .28);
  --hand: "Yusei Magic", "M PLUS Rounded 1c", system-ui, sans-serif;
  --body: "M PLUS Rounded 1c", "Noto Sans HK", system-ui, sans-serif;
  --zh: "Noto Sans HK", "PingFang HK", "Microsoft JhengHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-top: #25244a;
    --sky-mid: #3b3a73;
    --sky-low: #54528f;
    --bg: #1b1a2c;
    --surface: #26253b;
    --surface-2: #2f2e48;
    --bubble: #35334f;
    --ink: #f4eefb;
    --ink-soft: #c1b8d6;
    --line: #45436a;
    --pink-deep: #ff84a9;
    --pink-press: #d9587f;
    --green: #6fd09f;
    --red: #ff877f;
    --shadow: 0 8px 22px rgba(0, 0, 0, .4);
    --ray: #ff84a9;
    --normal: #c1b8d6;
    --glass: rgba(143, 176, 224, .22);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-top: #25244a;
  --sky-mid: #3b3a73;
  --sky-low: #54528f;
  --bg: #1b1a2c;
  --surface: #26253b;
  --surface-2: #2f2e48;
  --bubble: #35334f;
  --ink: #f4eefb;
  --ink-soft: #c1b8d6;
  --line: #45436a;
  --pink-deep: #ff84a9;
  --pink-press: #d9587f;
  --green: #6fd09f;
  --red: #ff877f;
  --shadow: 0 8px 22px rgba(0, 0, 0, .4);
  --ray: #ff84a9;
  --normal: #c1b8d6;
  --glass: rgba(143, 176, 224, .22);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  line-height: 1.55;
  font-size: 16px;
}
.zh { font-family: var(--zh); font-weight: 500; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
h1, h2, h3 { line-height: 1.25; margin: 0; text-wrap: balance; }
h2 { font-size: 1.2rem; }
p { margin: 0; }
.muted { color: var(--ink-soft); }
.small { font-size: .86rem; }

/* ---------- Top bar ---------- */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  background: var(--sky-top); color: #fff;
}
.brand { font-family: var(--hand); font-size: 1.15rem; display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; color: #fff; }
.stats { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip {
  background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); border-radius: 999px; color: #fff;
  padding: 2px 10px; font-size: .85rem; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.chip.flame span { display: inline-block; animation: flicker 1.6s ease-in-out infinite; }
.iconbtn { background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 2px 12px; font-weight: 800; color: #fff; min-height: 32px; }

/* ---------- Sky hero ---------- */
.sky {
  position: relative; overflow: hidden; color: #fff;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
  padding: 22px 16px 72px;
}
.sky .inner { max-width: 900px; margin: 0 auto; position: relative; z-index: 2; display: grid; gap: 10px; }
.sky .title { font-family: var(--hand); font-weight: 400; font-size: clamp(1.9rem, 6vw, 3rem); line-height: 1.12; text-shadow: 0 2px 0 rgba(74,59,59,.25); }
.sky .sub { font-weight: 700; }
.sky .clouds { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 64px; z-index: 1; color: var(--bg); }
.sky .star { position: absolute; color: #fff; font-size: 14px; animation: twinkle 2.8s ease-in-out infinite; z-index: 1; }
.sky.slim { padding: 14px 16px 56px; }
.sky.slim .title { font-size: clamp(1.4rem, 4.5vw, 1.9rem); }
.cast { display: flex; justify-content: center; align-items: flex-end; margin-top: 4px; }
.cast .fig { width: clamp(62px, 17vw, 118px); margin: 0 -5px; animation: bob 2.6s ease-in-out infinite; }
.cast .fig:nth-child(2) { animation-delay: -.5s; width: clamp(70px, 19vw, 130px); }
.cast .fig:nth-child(3) { animation-delay: -1s; width: clamp(80px, 21vw, 146px); }
.cast .fig:nth-child(4) { animation-delay: -1.5s; width: clamp(70px, 19vw, 130px); }
.cast .fig:nth-child(5) { animation-delay: -2s; }
.cast .fig svg { width: 100%; height: auto; display: block; overflow: visible; }

/* ---------- Layout ---------- */
.wrap { max-width: 760px; margin: -40px auto 0; padding: 0 16px 36px; position: relative; z-index: 3; display: grid; gap: 14px; }
.card {
  background: var(--surface); border: 2px solid var(--line); border-radius: 24px;
  padding: 18px; box-shadow: var(--shadow); display: grid; gap: 12px; min-width: 0;
}
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn {
  border: 2px solid var(--pink-deep); background: var(--pink-deep); color: #fff;
  border-radius: 16px; padding: 10px 18px; font-weight: 800; min-height: 46px;
  box-shadow: 0 4px 0 var(--pink-press); transition: transform .08s, box-shadow .08s;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--pink-press); }
.btn.ghost { background: var(--surface); color: var(--pink-deep); box-shadow: 0 4px 0 var(--line); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.wiggle { animation: wiggle 1.8s ease-in-out infinite; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* ---------- Dialogue ---------- */
.say { display: flex; gap: 10px; align-items: flex-start; animation: pop .35s ease-out both; }
.say:nth-child(2) { animation-delay: .12s; }
.say:nth-child(3) { animation-delay: .24s; }
.say .av { flex: 0 0 52px; width: 52px; height: 52px; animation: bob 2.4s ease-in-out infinite; }
.say .av svg { width: 100%; height: 100%; overflow: visible; }
.bubble {
  background: var(--bubble); border: 2px solid var(--line); border-radius: 6px 18px 18px 18px;
  padding: 8px 12px; min-width: 0;
}
.bubble .name { display: block; font-size: .78rem; font-weight: 800; color: var(--ink-soft); letter-spacing: .03em; }

/* ---------- Map ---------- */
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.room {
  text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 20px;
  padding: 14px; display: grid; gap: 4px; align-content: start; transition: transform .12s;
}
.room:hover:not(:disabled) { transform: translateY(-3px); }
.room.done { border-color: var(--green); }
.room.next { border-color: var(--pink-deep); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pink-deep) 22%, transparent); }
.room:disabled { opacity: .55; cursor: not-allowed; }
.room .top { display: flex; justify-content: space-between; align-items: center; }
.room .emoji { font-size: 1.8rem; }
.room .num { font-family: var(--hand); color: var(--ink-soft); }
.room .t { font-weight: 800; }
.room .s { font-size: .85rem; color: var(--ink-soft); }
.mastery { display: grid; gap: 8px; }
.mastery .lbl { display: flex; justify-content: space-between; gap: 8px; font-size: .88rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--pink), var(--pink-deep)); border-radius: 999px; transition: width .6s ease; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: .85rem; font-weight: 700; }

/* ---------- Puzzle ---------- */
.locks { display: flex; gap: 6px; flex-wrap: wrap; }
.lock {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  background: rgba(255,255,255,.22); border: 2px solid rgba(255,255,255,.5); font-size: 1.05rem;
}
.lock.open { background: rgba(255,255,255,.9); border-color: #fff; }
.lock.cur { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.35); }
.lock.opening { animation: unlock .7s ease-out; }
.q { font-weight: 800; font-size: 1.08rem; }
.qnum { font-family: var(--hand); color: var(--pink-deep); font-size: 1rem; }
.choices { display: grid; gap: 10px; }
.choice {
  text-align: left; background: var(--surface-2); border: 2px solid var(--line); border-radius: 16px;
  padding: 11px 14px; min-height: 48px; display: flex; gap: 10px; align-items: flex-start;
  transition: transform .08s, border-color .15s;
}
.choice .letter { font-weight: 800; color: var(--pink-deep); flex: 0 0 auto; }
.choice:hover:not(:disabled) { border-color: var(--pink); }
.choice:active:not(:disabled) { transform: scale(.98); }
.choice.right { border-color: var(--green); background: color-mix(in srgb, var(--green) 18%, var(--surface)); animation: pop .35s ease-out; }
.choice.wrong { border-color: var(--red); background: color-mix(in srgb, var(--red) 12%, var(--surface)); }
.choice:disabled { cursor: default; }
.numrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.numrow input {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--surface-2); border: 2px solid var(--line);
  border-radius: 14px; padding: 10px 12px; width: 150px; min-height: 46px; font-variant-numeric: tabular-nums;
}
.numrow .unit { font-weight: 800; color: var(--ink-soft); }
.feedback { border-radius: 18px; padding: 12px 14px; display: grid; gap: 10px; animation: pop .3s ease-out; }
.feedback.ok { background: color-mix(in srgb, var(--green) 14%, var(--surface)); border: 2px solid var(--green); }
.feedback.no { background: color-mix(in srgb, var(--red) 10%, var(--surface)); border: 2px solid var(--red); }
.terms { display: flex; flex-wrap: wrap; gap: 6px; }
.term { background: var(--surface); border: 1px dashed var(--lav); border-radius: 10px; padding: 3px 9px; font-size: .88rem; }
.term .zh { color: var(--pink-deep); margin-left: 5px; }
.tip { border-left: 4px solid var(--yellow); background: color-mix(in srgb, var(--yellow) 18%, var(--surface)); border-radius: 0 12px 12px 0; padding: 8px 12px; font-size: .92rem; }
.diagram-box { overflow-x: auto; }
.diagram { display: block; width: 100%; max-width: 420px; height: auto; margin: 0 auto; color: var(--ink); }
.card.shake { animation: shake .45s ease-in-out; }
.notes ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

/* ---------- Save panel ---------- */
details summary { cursor: pointer; font-weight: 800; }
details[open] summary { margin-bottom: 10px; }
pre.json {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0;
  overflow: auto; font-size: .78rem; max-height: 300px; white-space: pre;
}
textarea {
  width: 100%; min-height: 90px; font-family: ui-monospace, monospace; font-size: 16px;
  color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px;
}
input.name {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--surface-2); border: 2px solid var(--line);
  border-radius: 14px; padding: 10px 12px; width: 100%; max-width: 300px; min-height: 46px;
}
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 16px; font-weight: 700;
  max-width: calc(100% - 32px); z-index: 30; box-shadow: var(--shadow);
}
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
footer { text-align: center; font-size: .78rem; color: var(--ink-soft); padding: 0 16px 24px; }

/* ---------- Motion ---------- */
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes pop { 0% { transform: scale(.9); } 70% { transform: scale(1.03); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
@keyframes unlock { 0% { transform: rotate(0) scale(1); } 30% { transform: rotate(-14deg) scale(1.15); } 60% { transform: rotate(10deg) scale(1.25); } 100% { transform: rotate(0) scale(1); } }
@keyframes wiggle { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-4deg); } 90% { transform: rotate(4deg); } 95% { transform: rotate(-2deg); } }
@keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
@keyframes flicker { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.15) rotate(-6deg); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Tablet / desktop ---------- */
@media (min-width: 700px) {
  body { font-size: 17px; }
  .wrap { max-width: 900px; padding-inline: 24px; }
  .choices { grid-template-columns: 1fr 1fr; }
  .say .av { flex-basis: 60px; width: 60px; height: 60px; }
  .diagram { max-width: 480px; }
  .rooms { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .sky { padding: 28px 24px 80px; }
}
@media (min-width: 1100px) { .wrap { max-width: 980px; } }
@media (max-width: 480px) { .card { padding: 14px; border-radius: 20px; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="sketch"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="1.8"/></filter>
</svg>
<header class="top">
  <button class="brand" id="home" aria-label="Back to the room map">✦ Chiikawa Physics Escape</button>
  <div class="stats" id="stats"></div>
</header>
<div id="hero"></div>
<main class="wrap" id="app"></main>
<footer>Fan-made study game for S3 Physics. Not affiliated with the official Chiikawa brand. Characters are original hand-drawn tributes.</footer>
<div id="toast" class="toast" hidden></div>
<canvas id="fx" hidden></canvas>

<script>
/* ============================================================
   Characters: original hand-drawn style tributes (SVG)
   mood: "normal" | "happy" | "cry"
   ============================================================ */
const INK = "#4a3b3b";
let clipN = 0;
function eyes(x1, x2, y, mood, big) {
  if (mood === "happy") return `<path d="M${x1 - 3.2} ${y + 1.2} q3.2 -4.4 6.4 0 M${x2 - 3.2} ${y + 1.2} q3.2 -4.4 6.4 0" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/>`;
  const rx = big ? 3.8 : 2.7, ry = big ? 4.4 : 3.3, hr = big ? 1.4 : 1;
  let s = `<ellipse cx="${x1}" cy="${y}" rx="${rx}" ry="${ry}" fill="${INK}"/><ellipse cx="${x2}" cy="${y}" rx="${rx}" ry="${ry}" fill="${INK}"/>
    <circle cx="${x1 + 1}" cy="${y - 1.3}" r="${hr}" fill="#fff"/><circle cx="${x2 + 1}" cy="${y - 1.3}" r="${hr}" fill="#fff"/>`;
  if (mood === "cry") s += `<path d="M${x1} ${y + 4} q-2.4 4.5 0 6.5 q2.4 -2 0 -6.5Z M${x2} ${y + 4} q-2.4 4.5 0 6.5 q2.4 -2 0 -6.5Z" fill="#9fd0f5" stroke="#5b8fc9" stroke-width=".8"/>`;
  return s;
}
function blush(x1, x2, y) {
  const hatch = x => `M${x - 3.5} ${y + 1.6} l1.6 -3.2 M${x - .5} ${y + 1.6} l1.6 -3.2 M${x + 2.5} ${y + 1.6} l1.6 -3.2`;
  return `<ellipse cx="${x1}" cy="${y}" rx="5.2" ry="3.2" fill="#f7a9b8" opacity=".9"/><ellipse cx="${x2}" cy="${y}" rx="5.2" ry="3.2" fill="#f7a9b8" opacity=".9"/>
    <path d="${hatch(x1)} ${hatch(x2)}" stroke="#e0708c" stroke-width=".9" stroke-linecap="round"/>`;
}
function mouth(x, y, mood, open) {
  if (mood === "cry") return `<path d="M${x - 4.5} ${y + 1.5} q2.25 -2.5 4.5 0 q2.25 2.5 4.5 0" fill="none" stroke="${INK}" stroke-width="1.8" stroke-linecap="round"/>`;
  if (open || mood === "happy") return `<path d="M${x - 3.8} ${y - 1} q3.8 6 7.6 0 Z" fill="#e8628a" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>`;
  return `<path d="M${x - 2.6} ${y} q1.3 1.8 2.6 0 q1.3 1.8 2.6 0" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/>`;
}
const OUT = `stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"`;
const CHAR = {
  chiikawa: { name: "Chiikawa", color: "#ffffff",
    head: m => `<circle cx="17" cy="17" r="7" fill="#fff" ${OUT}/><circle cx="47" cy="17" r="7" fill="#fff" ${OUT}/>
      <ellipse cx="32" cy="37" rx="25" ry="21" fill="#fff" ${OUT}/>${blush(15, 49, 43)}${eyes(24, 40, 36, m)}${mouth(32, 43, m)}` },
  hachiware: { name: "Hachiware", color: "#ffffff",
    head: m => { const id = "hc" + (++clipN); return `<path d="M9 26 L13 5 L26 16Z" fill="#8fb0e0" ${OUT}/><path d="M55 26 L51 5 L38 16Z" fill="#8fb0e0" ${OUT}/>
      <clipPath id="${id}"><ellipse cx="32" cy="37" rx="25" ry="21"/></clipPath>
      <ellipse cx="32" cy="37" rx="25" ry="21" fill="#fff"/>
      <path clip-path="url(#${id})" d="M0 33 L0 0 L64 0 L64 33 L42 33 L32 17 L22 33 Z" fill="#8fb0e0"/>
      <ellipse cx="32" cy="37" rx="25" ry="21" fill="none" ${OUT}/>${blush(15, 49, 44)}${eyes(24, 40, 38, m)}${mouth(32, 45, m)}`; } },
  usagi: { name: "Usagi", color: "#f8e6a0",
    head: m => `<ellipse cx="23" cy="10" rx="5.5" ry="13" fill="#f8e6a0" ${OUT}/><ellipse cx="41" cy="10" rx="5.5" ry="13" fill="#f8e6a0" ${OUT}/>
      <ellipse cx="23" cy="10" rx="2" ry="8" fill="#f7b7c3"/><ellipse cx="41" cy="10" rx="2" ry="8" fill="#f7b7c3"/>
      <ellipse cx="32" cy="38" rx="24" ry="20" fill="#f8e6a0" ${OUT}/>${blush(15, 49, 44)}${eyes(24, 40, 37, m)}${mouth(32, 45, m, true)}` },
  momonga: { name: "Momonga", color: "#ffffff",
    head: m => { const id = "mc" + (++clipN); return `<circle cx="14" cy="21" r="6.5" fill="#b9b6ea" ${OUT}/><circle cx="50" cy="21" r="6.5" fill="#b9b6ea" ${OUT}/>
      <clipPath id="${id}"><ellipse cx="32" cy="37" rx="25" ry="21"/></clipPath>
      <ellipse cx="32" cy="37" rx="25" ry="21" fill="#fff"/>
      <path clip-path="url(#${id})" d="M0 30 Q32 15 64 30 L64 0 L0 0 Z" fill="#b9b6ea"/>
      <ellipse cx="32" cy="37" rx="25" ry="21" fill="none" ${OUT}/>${blush(14, 50, 45)}${eyes(23, 41, 38, m, true)}${mouth(32, 46, m)}`; } },
  kurimanju: { name: "Kuri-Manju", color: "#efd3a6",
    head: m => { const id = "kc" + (++clipN);
      const e = m === "normal" ? `<path d="M21 37 h6 M37 37 h6" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>` : eyes(24, 40, 37, m);
      return `<clipPath id="${id}"><path d="M8 45 Q6 18 32 16 Q58 18 56 45 Q32 56 8 45Z"/></clipPath>
      <path d="M8 45 Q6 18 32 16 Q58 18 56 45 Q32 56 8 45Z" fill="#efd3a6"/>
      <path clip-path="url(#${id})" d="M0 29 Q32 19 64 29 L64 0 L0 0 Z" fill="#a8703f"/>
      <path d="M8 45 Q6 18 32 16 Q58 18 56 45 Q32 56 8 45Z" fill="none" ${OUT}/>${blush(15, 49, 43)}${e}${mouth(32, 44, m)}`; } }
};

const SFX = {
  ctx: null, on: true,
  init() {
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === "suspended") this.ctx.resume();
    } catch (e) { this.ctx = null; }
  },
  tone(freq, dur, { type = "sine", vol = .16, at = 0, to = null } = {}) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + at, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + .02);
  },
  tap() { this.tone(660, .07, { type: "triangle", vol: .08 }); },
  right() { [784, 988, 1319].forEach((f, i) => this.tone(f, .22, { type: "triangle", at: i * .09, vol: .14 })); },
  wrong() { this.tone(330, .18, { type: "square", vol: .05, to: 220 }); this.tone(247, .3, { type: "triangle", vol: .1, at: .14, to: 165 }); },
  unlock() { this.tone(1800, .04, { type: "square", vol: .05 }); this.tone(1200, .05, { type: "square", vol: .05, at: .05 }); this.tone(1568, .3, { at: .12, vol: .12 }); },
  hint() { this.tone(1046, .35, { vol: .1 }); this.tone(1568, .45, { vol: .06, at: .08 }); },
  chest() { [523, 659, 784, 1046, 1319, 1568].forEach((f, i) => this.tone(f, .18, { type: "triangle", at: i * .06, vol: .1 })); },
  fanfare() {
    [[523, 0], [659, .12], [784, .24], [1046, .36], [784, .52], [1046, .64]].forEach(([f, a]) => this.tone(f, .28, { type: "triangle", at: a, vol: .14 }));
    this.tone(1319, .8, { at: .8, vol: .12 });
  },
  voice(who) {
    const v = { chiikawa: [[1100, 1400], [1300, 1000]], hachiware: [[620, 760], [700, 820]], usagi: [[1400, 1900], [1700, 1300], [1500, 2000]],
      momonga: [[1200, 1500], [1500, 1250]], kurimanju: [[330, 300]] }[who] || [[800, 900]];
    v.forEach(([a, b], i) => this.tone(a, .09, { vol: .07, at: i * .1, to: b }));
  }
};

function load() {

// Same day → no change; next day → +1; missed days → shields cover them, otherwise restart at 1.
function checkIn() {
  const t = today();
  if (!S.last_login_date) {
    S.current_streak = 1;
    streakNote = "🔥 Day 1 of your streak! Every legendary adventure starts somewhere.";
  } else if (S.last_login_date !== t) {
    const gap = dayNum(t) - dayNum(S.last_login_date);
    if (gap === 1) {
      S.current_streak += 1;
      streakNote = `🔥 Streak up! ${S.current_streak} days in a row.`;
    } else if (gap > 1) {
      const missed = gap - 1;
      if (S.streak_shields >= missed) {
        S.streak_shields -= missed;
        S.current_streak += 1;
        streakNote = `🛡️ Hachiware used ${missed} streak shield${missed > 1 ? "s" : ""} to protect your streak! Now ${S.current_streak} days.`;
      } else {
        S.current_streak = 1;
        streakNote = "🌱 Welcome back! Your streak restarted at 1. Chiikawa is just happy you're here.";
      }
    }
    if (S.current_streak > 0 && S.current_streak % 7 === 0 && S.streak_shields < 3) {
      S.streak_shields += 1;
      streakNote += " 🛡️ 7-day milestone: +1 streak shield!";
    }
  }
  S.longest_streak = Math.max(S.longest_streak || 0, S.current_streak);
  S.last_login_date = t;
  save();
}

function recomputeMastery() {
  const totals = {}, got = {};
  ROOMS.forEach(r => r.puzzles.forEach((_, i) => {
    totals[r.topic] = (totals[r.topic] || 0) + 1;
    if (S.mastered_puzzles.includes(`${r.id}-${i}`)) got[r.topic] = (got[r.topic] || 0) + 1;
  }));
  Object.keys(S.physics_mastery).forEach(k => {
    S.physics_mastery[k] = totals[k] ? Math.round(100 * (got[k] || 0) / totals[k]) : 0;
  });
}

/* Confetti & sparkles */
function confetti(amount = 140) {
  if (reduced()) return;
  const cv = document.getElementById("fx"), ctx = cv.getContext("2d");
  cv.hidden = false;
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ["#f7a9b8", "#e25f8a", "#8fb0e0", "#f6df8c", "#b9b6ea", "#9fe0c0"];
  const ps = Array.from({ length: amount }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35,
    vx: (Math.random() - .5) * 11, vy: -Math.random() * 11 - 4, r: Math.random() * 5 + 3,
    c: pick(cols), s: Math.random() < .3, a: Math.random() * 6, va: (Math.random() - .5) * .3
  }));
  const start = performance.now();
  (function frame(now) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => {
      p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      if (p.s) { ctx.font = `${p.r * 4}px sans-serif`; ctx.fillText("✦", 0, 0); }
      else ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
      ctx.restore();
    });
    if (now - start < 2600) requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
  })(start);
}

      <h2>🎒 Badges and bag</h2>
      <div class="badges">${S.chiikawa_badges.length ? S.chiikawa_badges.map(b => `<span class="tag">${esc(b)}</span>`).join("") : `<span class="muted small">No badges yet. Escape a room to earn one!</span>`}</div>
      <div class="badges">${S.inventory.length ? S.inventory.map(b => `<span class="tag">${esc(b)}</span>`).join("") : `<span class="muted small">Your bag is empty. Momonga says the daily chest might help… 👀</span>`}</div>
      <p class="small muted">🔥 Longest streak: ${S.longest_streak} days · 🛡️ A shield saves your streak if you miss a day. Earn one every 7 days (max 3).</p>
    </section>

    ${saveDataPanel()}`;

  $app.querySelectorAll("[data-room]").forEach(b => b.onclick = () => { SFX.init(); SFX.tap(); startRoom(b.dataset.room); });
  const chest = document.getElementById("chest");
  if (chest && chestReady) chest.onclick = openChest;
  wireSavePanel();
}

function openChest() {
  SFX.init(); SFX.chest(); confetti(70);
  const snack = pick(SNACKS);
  S.inventory.push(snack);
  let extra = "";
  if (Math.random() < 0.2 && S.streak_shields < 3) { S.streak_shields += 1; extra = " …and a 🛡️ streak shield!"; }
  S.last_chest_date = today();
  streakNote = `🎁 Kuri-Manju opened the chest: ${snack}${extra}`;
  save();
  renderMap();
  window.scrollTo({ top: 0, behavior: reduced() ? "auto" : "smooth" });
}

function saveDataPanel() {
  return `<section class="card">
    <details>
      <summary>🔒 Save data (progress JSON)</summary>
      <div style="display:grid;gap:10px">
        <p class="small muted">Progress is saved in this browser only. Copy it to move to another device, or paste a save to restore it.</p>
        <pre class="json" id="json">${esc(JSON.stringify(S, null, 2))}</pre>
        <div class="row"><button class="btn ghost" id="copy">Copy save</button></div>
        <label for="imp" class="small"><b>Restore from a save</b></label>
        <textarea id="imp" placeholder="Paste your save here"></textarea>
        <div class="row">
          <button class="btn ghost" id="doimp">Restore</button>
          <button class="btn ghost" id="reset">Start over</button>
        </div>
      </div>
    </details>
  </section>`;
}
function wireSavePanel() {
  document.getElementById("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(JSON.stringify(S, null, 2)); toast("Save copied 📋"); }
    catch (e) {
      const r = document.createRange(); r.selectNodeContents(document.getElementById("json"));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      toast("Text selected. Press copy on your device.");
    }
  };
  document.getElementById("doimp").onclick = () => {
    try {
      const obj = JSON.parse(document.getElementById("imp").value);
      if (typeof obj !== "object" || !obj) throw 0;
      S = Object.assign(freshState(), obj);
      S.physics_mastery = Object.assign(freshState().physics_mastery, obj.physics_mastery || {});
      save(); streakNote = "💾 Save restored!"; renderMap();
    } catch (e) { toast("That isn't a valid save. Copy the whole text and try again."); }
  };
  document.getElementById("reset").onclick = e => {
    if (document.getElementById("resetask")) return;
    e.currentTarget.insertAdjacentHTML("afterend", `<span class="row" id="resetask"><b class="small">Erase all progress?</b>
      <button class="btn" id="resetyes">Yes, start over</button><button class="btn ghost" id="resetno">Keep my progress</button></span>`);
    document.getElementById("resetno").onclick = () => document.getElementById("resetask").remove();
    document.getElementById("resetyes").onclick = () => {
      try { localStorage.removeItem(KEY); } catch (e) {}
      S = null; streakNote = ""; renderWelcome();
    };
  };
}

/* ----- Room play ----- */
let R = null;

function startRoom(id) {
  const room = ROOMS[roomIndex(id)];
  const done = S.completed_rooms.includes(room.name);
  const savedIdx = S.room_progress[room.id] || 0;
  R = { room, idx: done ? 0 : Math.min(savedIdx, room.puzzles.length - 1), attempts: 0, usedHint: false, replay: done };
  S.current_room = room.name;
  save();
  if (!sessionStart) sessionStart = Date.now();
  streakNote = "";
  renderPuzzle(true);
  window.scrollTo({ top: 0 });
  setTimeout(() => SFX.voice(room.intro[0][0]), 150);
}

function locksHtml(openingIdx = -1) {
  const { room, idx } = R;
  return room.puzzles.map((_, i) => {
    const open = i < idx || i === openingIdx;
    return `<span class="lock ${open ? "open" : ""} ${i === idx && i !== openingIdx ? "cur" : ""} ${i === openingIdx ? "opening" : ""}" aria-label="Lock ${i + 1}${open ? " open" : ""}">${open ? "🔓" : "🔒"}</span>`;
  }).join("");
}

function renderPuzzle(withIntro) {
  renderStats();
  const { room, idx } = R;
  const p = room.puzzles[idx];
  $hero.innerHTML = sky(`
    <div class="row" style="justify-content:space-between">
      <button class="iconbtn" id="back">← Map</button>
      <span class="chip">${room.emoji} Lock ${idx + 1} / ${room.puzzles.length}</span>
    </div>
    <h1 class="title">${esc(room.name.split(": ")[1])} <span class="zh" style="font-size:.6em">${room.zh}</span></h1>
    <div class="locks" id="locks">${locksHtml()}</div>`, true);
  let nudge = "";
  if (!nudged && sessionMinutes() >= 12) {
    nudged = true;
    nudge = say("kurimanju", "You've been exploring for over 12 minutes. Great session! It's fine to finish this lock and rest. Your progress is saved. 🍵");
  }
  $app.innerHTML = `
    <section class="card" id="qcard">
      ${withIntro && idx === 0 ? room.intro.map(([w, m, t]) => say(w, t, m)).join("") : ""}
      ${nudge}
      <span class="qnum">Q${idx + 1}</span>
      <p class="q">${esc(p.q)}</p>
      ${p.svg ? `<div class="diagram-box">${DIAGRAMS[p.svg]}</div>` : ""}
      ${p.type === "mc"
        ? `<div class="choices">${p.choices.map((c, i) => `<button class="choice" data-i="${i}"><span class="letter">${String.fromCharCode(65 + i)}</span><span>${esc(c)}</span></button>`).join("")}</div>`
        : `<div class="numrow"><input id="num" inputmode="decimal" placeholder="Your answer" aria-label="Your answer"> <span class="unit">${esc(p.unit)}</span> <button class="btn" id="check">Check</button></div>`}
      <div class="row"><button class="btn ghost" id="hint">💡 Ask Hachiware for a hint</button></div>
      <div id="fb"></div>
    </section>`;

  document.getElementById("back").onclick = () => { SFX.tap(); renderMap(); };
  document.getElementById("hint").onclick = () => {
    SFX.init(); SFX.hint();
    document.getElementById("fb").innerHTML = say("hachiware", `💡 ${esc(p.hint)}`);
    R.usedHint = true;
  };
  if (p.type === "mc") {
    $app.querySelectorAll(".choice").forEach(b => b.onclick = () => {
      SFX.init();
      const i = Number(b.dataset.i);
      if (i === p.answer) { b.classList.add("right"); $app.querySelectorAll(".choice").forEach(x => (x.disabled = true)); onCorrect(); }
      else { b.classList.add("wrong"); b.disabled = true; onWrong(); }
    });
  } else {
    const inp = document.getElementById("num");
    const check = () => {
      SFX.init();
      const v = parseFloat(inp.value.replace(",", "."));
      if (Number.isNaN(v)) { toast("Type a number first 🙂"); return; }
      if (Math.abs(v - p.answer) <= p.tol) { inp.disabled = true; document.getElementById("check").disabled = true; onCorrect(); }
      else onWrong();
    };
    document.getElementById("check").onclick = check;
    inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  }
}

function onWrong() {
  R.attempts += 1;
  SFX.wrong();
  const card = document.getElementById("qcard");
  card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  const p = R.room.puzzles[R.idx];
  const [w, t] = pick(OOPS);
  document.getElementById("fb").innerHTML = `<div class="feedback no">${say(w, t, "cry")}${say("hachiware", `Don't worry! We can figure this out together. 💡 ${esc(p.hint)}`)}</div>`;
}

function onCorrect() {
  const { room, idx } = R;
  const p = room.puzzles[idx];
  const pid = `${room.id}-${idx}`;
  const firstTry = R.attempts === 0 && !R.usedHint;
  if (firstTry && !S.mastered_puzzles.includes(pid)) S.mastered_puzzles.push(pid);
  if (!R.replay) S.room_progress[room.id] = idx + 1;
  recomputeMastery(); save();
  SFX.right(); setTimeout(() => SFX.unlock(), 330);
  document.getElementById("hint").hidden = true;
  document.getElementById("locks").innerHTML = locksHtml(idx);
  if (firstTry) confetti(40);
  const [w, t] = pick(CHEERS);
  const last = idx === room.puzzles.length - 1;
  document.getElementById("fb").innerHTML = `<div class="feedback ok">
      ${say(w, t, "happy")}
      <p><b>✅ ${firstTry ? "First try! Mastery up 📈" : "Unlocked!"}</b></p>
      <p>${esc(p.explain)}</p>
      ${p.tip ? `<p class="tip"><b>📝 Exam tip 考試貼士:</b> ${esc(p.tip)}</p>` : ""}
      ${p.terms ? `<div class="terms" aria-label="Key terms">${p.terms.map(([en, zh]) => `<span class="term">${esc(en)}<span class="zh">${zh}</span></span>`).join("")}</div>` : ""}
      <div class="row"><button class="btn" id="next">${last ? "Open the exit door 🚪" : "Next lock →"}</button></div>
    </div>`;
  document.getElementById("next").onclick = () => {
    SFX.tap();
    if (last) return finishRoom();
    R.idx += 1; R.attempts = 0; R.usedHint = false;
    renderPuzzle(false);
    window.scrollTo({ top: 0, behavior: reduced() ? "auto" : "smooth" });
  };
  document.getElementById("fb").scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "nearest" });
}

function finishRoom() {
  const { room } = R;
  const first = !S.completed_rooms.includes(room.name);
  if (first) {
    S.completed_rooms.push(room.name);
    S.chiikawa_badges.push(room.badge);
    S.inventory.push(room.item);
  }
  S.room_progress[room.id] = room.puzzles.length;
  const ni = nextRoomIndex();
  S.current_room = ni === -1 ? "All rooms escaped! 🎉" : ROOMS[ni].name;
  recomputeMastery(); save(); renderStats();
  SFX.fanfare(); confetti(180);
  $hero.innerHTML = sky(`
    <h1 class="title">You escaped!<br>${esc(room.name.split(": ")[1])}</h1>
    <p class="sub">好嘢! Room ${roomIndex(room.id) + 1} complete</p>
    ${cast({ chiikawa: "happy", hachiware: "happy", usagi: "happy", momonga: "happy", kurimanju: "happy" })}`);
  $app.innerHTML = `
    <section class="card">
      ${say("chiikawa", "Ya...!!! We're free! 🥹💕", "happy")}
      ${say("usagi", "YAHA!!! URA!!! 🐰🎊", "happy")}
      ${first
        ? say("momonga", `Fine, fine, you earned it: <b>${esc(room.badge)}</b> and <b>${esc(room.item)}</b> for your bag! 💜`, "happy")
        : say("kurimanju", "Replay complete. Practice makes the brain strong. 🍵", "happy")}
    </section>
    <section class="card notes">
      <h2>📖 Room notes 重點筆記</h2>
      <ul>${room.notes.map(n => `<li>${n}</li>`).join("")}</ul>
    </section>
    <section class="card">
      ${say("hachiware", ni === -1
        ? "That was the final room. You've mastered Light! Come back any day to keep your streak and replay rooms. 🌟"
        : `That's today's mission done! 🌱 Next time: <b>${esc(ROOMS[ni].name)}</b>. Come back tomorrow to grow your 🔥 streak!`, "happy")}
      <div class="row"><button class="btn" id="map">Back to the map</button></div>
    </section>`;
  document.getElementById("map").onclick = () => { SFX.tap(); renderMap(); };
  window.scrollTo({ top: 0, behavior: reduced() ? "auto" : "smooth" });
}

/* ============================================================
   Boot
   ============================================================ */
document.getElementById("home").onclick = () => { if (S) { SFX.tap(); renderMap(); } };
document.addEventListener("pointerdown", () => SFX.init(), { once: true });
if (S) { checkIn(); renderMap(); } else { renderWelcome(); }
</script>
</body>
</html>
