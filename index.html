<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chiikawa Physics Escape</title>
<meta name="description" content="A bite-sized, Chiikawa-themed escape room that teaches S3 Physics: Light & Optics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff8f3;
  --surface: #ffffff;
  --surface-2: #fff1e8;
  --ink: #3b2f2f;
  --ink-soft: #7a6660;
  --line: #f0dcd0;
  --pink: #ff9eb5;
  --pink-deep: #e0587e;
  --blue: #7fa7d8;
  --yellow: #ffd66b;
  --green: #5fb88a;
  --red: #e0645a;
  --shadow: 0 6px 18px rgba(120, 70, 50, .10);
  --ray: #e0587e;
  --normal: #7a6660;
  --glass: rgba(127, 167, 216, .25);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1a1d;
    --surface: #2a2327;
    --surface-2: #332a2f;
    --ink: #f6ebe6;
    --ink-soft: #c2b0a9;
    --line: #463a40;
    --pink: #ff9eb5;
    --pink-deep: #ff7fa1;
    --blue: #93b6e3;
    --yellow: #ffd66b;
    --green: #74cf9f;
    --red: #ff8479;
    --shadow: 0 6px 18px rgba(0, 0, 0, .35);
    --ray: #ff7fa1;
    --normal: #c2b0a9;
    --glass: rgba(147, 182, 227, .22);
  }
}
:root[data-theme="dark"] {
  --bg: #1f1a1d;
  --surface: #2a2327;
  --surface-2: #332a2f;
  --ink: #f6ebe6;
  --ink-soft: #c2b0a9;
  --line: #463a40;
  --pink: #ff9eb5;
  --pink-deep: #ff7fa1;
  --blue: #93b6e3;
  --yellow: #ffd66b;
  --green: #74cf9f;
  --red: #ff8479;
  --shadow: 0 6px 18px rgba(0, 0, 0, .35);
  --ray: #ff7fa1;
  --normal: #c2b0a9;
  --glass: rgba(147, 182, 227, .22);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "M PLUS Rounded 1c", system-ui, sans-serif;
  line-height: 1.55;
  font-size: 16px;
}
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
header.top {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 16px; background: var(--surface); border-bottom: 2px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
.brand { font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 10px; font-size: .85rem; font-weight: 700; white-space: nowrap;
}
.card {
  background: var(--surface); border: 2px solid var(--line); border-radius: 20px;
  padding: 18px; box-shadow: var(--shadow); margin: 14px 0;
}
h1, h2, h3 { line-height: 1.25; margin: 0 0 8px; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.25rem; }
p { margin: 6px 0; }
.muted { color: var(--ink-soft); }
.btn {
  border: 2px solid var(--pink-deep); background: var(--pink-deep); color: #fff;
  border-radius: 14px; padding: 10px 18px; font-weight: 800;
}
.btn.ghost { background: transparent; color: var(--pink-deep); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.say { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; }
.say svg { flex: 0 0 48px; width: 48px; height: 48px; }
.bubble {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px 16px 16px 16px;
  padding: 8px 12px; min-width: 0;
}
.bubble b.name { display: block; font-size: .8rem; color: var(--ink-soft); }
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.room {
  text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 18px;
  padding: 14px; box-shadow: var(--shadow);
}
.room.done { border-color: var(--green); }
.room.next { border-color: var(--pink-deep); }
.room:disabled { opacity: .5; cursor: not-allowed; }
.room .emoji { font-size: 1.8rem; }
.room .t { font-weight: 800; display: block; }
.room .s { font-size: .85rem; color: var(--ink-soft); }
.locks { display: flex; gap: 6px; margin: 6px 0 12px; }
.lock {
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  background: var(--surface-2); border: 2px solid var(--line); font-size: 1rem;
}
.lock.open { border-color: var(--green); }
.lock.cur { border-color: var(--pink-deep); }
.q { font-weight: 700; font-size: 1.05rem; }
.choices { display: grid; gap: 8px; margin-top: 12px; }
.choice {
  text-align: left; background: var(--surface-2); border: 2px solid var(--line); border-radius: 14px;
  padding: 10px 14px;
}
.choice:hover:not(:disabled) { border-color: var(--pink); }
.choice.right { border-color: var(--green); background: color-mix(in srgb, var(--green) 18%, var(--surface)); }
.choice.wrong { border-color: var(--red); background: color-mix(in srgb, var(--red) 14%, var(--surface)); }
.numrow { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.numrow input {
  font: inherit; color: var(--ink); background: var(--surface-2); border: 2px solid var(--line);
  border-radius: 12px; padding: 9px 12px; width: 140px;
}
.numrow .unit { font-weight: 700; color: var(--ink-soft); }
.feedback { margin-top: 12px; border-radius: 14px; padding: 10px 14px; }
.feedback.ok { background: color-mix(in srgb, var(--green) 16%, var(--surface)); border: 1px solid var(--green); }
.feedback.no { background: color-mix(in srgb, var(--red) 12%, var(--surface)); border: 1px solid var(--red); }
.diagram { display: block; width: 100%; max-width: 420px; height: auto; margin: 10px auto 0; color: var(--ink); }
.bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--pink-deep); }
.mastery { display: grid; gap: 8px; }
.mastery .lbl { display: flex; justify-content: space-between; font-size: .88rem; font-weight: 700; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
details summary { cursor: pointer; font-weight: 800; }
pre.json {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
  overflow: auto; font-size: .8rem; max-height: 320px; white-space: pre;
}
textarea {
  width: 100%; min-height: 90px; font-family: ui-monospace, monospace; font-size: .8rem;
  color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px;
}
input.name {
  font: inherit; color: var(--ink); background: var(--surface-2); border: 2px solid var(--line);
  border-radius: 12px; padding: 9px 12px; width: 100%; max-width: 280px;
}
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; font-weight: 700;
  max-width: calc(100% - 32px); z-index: 20; box-shadow: var(--shadow);
}
.celebrate { text-align: center; font-size: 3rem; letter-spacing: 6px; }
.small { font-size: .85rem; }
@media (max-width: 480px) {
  h1 { font-size: 1.35rem; }
  .card { padding: 14px; }
}
</style>
</head>

function load() {
  try {
    const raw = localStorage.getItem(KEY);

  return null;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}

// Streak rules: same day → no change; next day → +1; missed days → a shield
// covers each missed day if available, otherwise the streak restarts at 1.
function checkIn() {
  const t = today();
  if (!S.last_login_date) {
    S.current_streak = 1;
    streakNote = "🔥 Day 1 of your streak! Every legendary adventure starts somewhere.";
  } else if (S.last_login_date !== t) {
    const gap = dayNum(t) - dayNum(S.last_login_date);
    if (gap === 1) {
      S.current_streak += 1;
      streakNote = `🔥 Streak up! ${S.current_streak} days in a row.`;
    } else if (gap > 1) {
      const missed = gap - 1;
      if (S.streak_shields >= missed) {
        S.streak_shields -= missed;
        S.current_streak += 1;
        streakNote = `🛡️ Hachiware used ${missed} streak shield${missed > 1 ? "s" : ""} to protect your streak! Now ${S.current_streak} days.`;
      } else {
        S.current_streak = 1;
        streakNote = "🌱 Welcome back! Your streak restarted at 1 — Chiikawa is just happy you're here.";
      }
    }
    // Earn a shield every 7-day milestone (max 3)
    if (S.current_streak > 0 && S.current_streak % 7 === 0 && S.streak_shields < 3) {
      S.streak_shields += 1;
      streakNote += " 🛡️ 7-day milestone: +1 streak shield!";
    }
  }
  S.longest_streak = Math.max(S.longest_streak || 0, S.current_streak);
  S.last_login_date = t;
  save();
}

function recomputeMastery() {
  const totals = {}, got = {};
  ROOMS.forEach(r => r.puzzles.forEach((_, i) => {
    totals[r.topic] = (totals[r.topic] || 0) + 1;
    if (S.mastered_puzzles.includes(`${r.id}-${i}`)) got[r.topic] = (got[r.topic] || 0) + 1;
  }));
  Object.keys(S.physics_mastery).forEach(k => {
    S.physics_mastery[k] = totals[k] ? Math.round(100 * (got[k] || 0) / totals[k]) : 0;
  });
}

  c.onclick = async () => {

    catch (e) { toast("Couldn't copy — select the text and copy it manually."); }
  };
  document.getElementById("doimp").onclick = () => {
    try {
      const obj = JSON.parse(document.getElementById("imp").value);
      if (typeof obj !== "object" || !obj) throw 0;
      S = Object.assign(freshState(), obj);
      S.physics_mastery = Object.assign(freshState().physics_mastery, obj.physics_mastery || {});
      save(); streakNote = "💾 Save restored!"; renderMap();
    } catch (e) { toast("That doesn't look like a valid save. 🥲"); }
  };
  document.getElementById("reset").onclick = () => {
    if (!confirm("Start over? This erases all progress in this browser.")) return;
    try { localStorage.removeItem(KEY); } catch (e) {}
    S = null; streakNote = ""; renderWelcome();
  };
}

  const done = S.completed_rooms.includes(room.name);
  const saved = S.room_progress[room.id] || 0;
  R = { room, idx: done ? 0 : Math.min(saved, room.puzzles.length - 1), attempts: 0, solved: false, replay: done };
  S.current_room = room.name;
  save();
  if (!sessionStart) sessionStart = Date.now();
  streakNote = "";
  renderPuzzle(true);
  window.scrollTo({ top: 0 });
}

function renderPuzzle(withIntro) {
  renderStats();
  const { room, idx } = R;
  const p = room.puzzles[idx];
  const locks = room.puzzles.map((_, i) => `<span class="lock ${i < idx ? "open" : ""} ${i === idx ? "cur" : ""}" aria-label="Lock ${i + 1}${i < idx ? " open" : ""}">${i < idx ? "🔓" : "🔒"}</span>`).join("");
  let nudge = "";
  if (!nudged && sessionMinutes() >= 12) {
    nudged = true;
    nudge = say("kurimanju", "You've been exploring for over 12 minutes. That's a great session! It's totally fine to finish this lock and rest. Your progress is saved. 🍵");
  }
  $app.innerHTML = `
    <div class="row" style="justify-content:space-between;margin-top:6px">
      <button class="btn ghost" id="back">← Map</button>
      <span class="chip">${room.emoji} Lock ${idx + 1} of ${room.puzzles.length}</span>
    </div>
    <section class="card">
      <h2>${esc(room.name)}</h2>
      <div class="locks">${locks}</div>
      ${withIntro && idx === 0 ? room.intro.map(([w, t]) => say(w, t)).join("") : ""}
      ${nudge}
      <p class="q">${esc(p.q)}</p>
      ${p.svg ? DIAGRAMS[p.svg] : ""}
      ${p.type === "mc"
        ? `<div class="choices">${p.choices.map((c, i) => `<button class="choice" data-i="${i}">${String.fromCharCode(65 + i)}. ${esc(c)}</button>`).join("")}</div>`
        : `<div class="numrow"><input id="num" inputmode="decimal" placeholder="Your answer" aria-label="Your answer"> <span class="unit">${esc(p.unit)}</span> <button class="btn" id="check">Check</button></div>`}
      <div class="row" style="margin-top:10px"><button class="btn ghost" id="hint">💡 Ask Hachiware for a hint</button></div>
      <div id="fb"></div>
    </section>`;

  document.getElementById("back").onclick = renderMap;
  document.getElementById("hint").onclick = () => {
    document.getElementById("fb").innerHTML = say("hachiware", `💡 ${esc(p.hint)}`);
    R.usedHint = true;
  };
  if (p.type === "mc") {
    $app.querySelectorAll(".choice").forEach(b => b.onclick = () => {
      const i = Number(b.dataset.i);
      if (i === p.answer) { b.classList.add("right"); lockChoices(); onCorrect(); }
      else { b.classList.add("wrong"); b.disabled = true; onWrong(); }
    });
  } else {
    const inp = document.getElementById("num");
    const check = () => {
      const v = parseFloat(inp.value.replace(",", "."));
      if (Number.isNaN(v)) { toast("Type a number first 🙂"); return; }
      if (Math.abs(v - p.answer) <= p.tol) { inp.disabled = true; document.getElementById("check").disabled = true; onCorrect(); }
      else onWrong();
    };
    document.getElementById("check").onclick = check;
    inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
    inp.focus({ preventScroll: true });
  }
}
function lockChoices() { $app.querySelectorAll(".choice").forEach(b => (b.disabled = true)); }

function onWrong() {
  R.attempts += 1;
  const p = R.room.puzzles[R.idx];
  const [w, t] = pick(OOPS);
  document.getElementById("fb").innerHTML = `<div class="feedback no">${say(w, t)}${say("hachiware", `Don't worry! We can figure this out together. 💡 ${esc(p.hint)}`)}</div>`;
}

function onCorrect() {
  const { room, idx } = R;
  const p = room.puzzles[idx];
  const pid = `${room.id}-${idx}`;
  const firstTry = R.attempts === 0 && !R.usedHint;
  if (firstTry && !S.mastered_puzzles.includes(pid)) S.mastered_puzzles.push(pid);
  if (!R.replay) S.room_progress[room.id] = idx + 1;
  recomputeMastery(); save();
  const [w, t] = pick(CHEERS);
  const last = idx === room.puzzles.length - 1;
  document.getElementById("fb").innerHTML = `<div class="feedback ok">
      ${say(w, t)}
      <p><b>✅ ${firstTry ? "First try! Mastery up 📈" : "Unlocked!"}</b></p>
      <p>${esc(p.explain)}</p>
      <div class="row" style="margin-top:8px"><button class="btn" id="next">${last ? "Open the exit door 🚪" : "Next lock →"}</button></div>
    </div>`;
  document.getElementById("next").onclick = () => {
    if (last) return finishRoom();
    R.idx += 1; R.attempts = 0; R.usedHint = false;
    renderPuzzle(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };
  document.getElementById("next").focus({ preventScroll: false });
}

function finishRoom() {
  const { room } = R;
  const first = !S.completed_rooms.includes(room.name);
  if (first) {
    S.completed_rooms.push(room.name);
    S.chiikawa_badges.push(room.badge);
    S.inventory.push(room.item);
  }
  S.room_progress[room.id] = room.puzzles.length;
  const ni = nextRoomIndex();
  S.current_room = ni === -1 ? "All rooms escaped! 🎉" : ROOMS[ni].name;
  recomputeMastery(); save(); renderStats();
  $app.innerHTML = `
    <section class="card">
      <div class="celebrate" aria-hidden="true">🎉✨🔓✨🎉</div>
      <h1 style="text-align:center">You escaped ${esc(room.name.split(": ")[1])}!</h1>
      ${say("chiikawa", "Ya...!!! We're free! 🥹💕")}
      ${say("usagi", "YAHA!!! URA!!! 🐰🎊")}
      ${first
        ? say("momonga", `Fine, fine, you earned it: <b>${esc(room.badge)}</b> and <b>${esc(room.item)}</b> for your bag! 💜`)
        : say("kurimanju", "Replay complete. Practice makes the brain strong. 🍵")}
      ${say("hachiware", ni === -1
        ? "That was the final room — you've mastered Light &amp; Optics! Come back any day to keep your streak and replay rooms. 🌟"
        : `That's today's mission done! 🌱 Next time: <b>${esc(ROOMS[ni].name)}</b>. Come back tomorrow to grow your 🔥 streak!`)}
      <div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="map">Back to the map</button></div>
    </section>`;
  document.getElementById("map").onclick = renderMap;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ============================================================
   Boot
   ============================================================ */
if (S) { checkIn(); renderMap(); } else { renderWelcome(); }
</script>
</body>
</html>
