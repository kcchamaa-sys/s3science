<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFDF6">
<title>Puff's Physics Escape</title>
<meta name="description" content="A cute escape room game for HK S3 Science: Light.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Huninn&family=Noto+Sans+TC:wght@400;700&family=Noto+Sans+HK:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Look follows the s1 "Mochi Science Pals" interface: cream page, soft clay cards, bottom tab bar. Escape-room scenes stay dim. */
:root {
  color-scheme: light;
  --cream: #FFFDF6;
  --cream-2: #FFF8E8;
  --ink: #5B4B49;
  --ink-soft: #8A7773;
  --pink: #FFE5EC;
  --pink-2: #FFF0F4;
  --rose: #E8AEB7;
  --blue: #DDF4FF;
  --blue-2: #EAF7FF;
  --yellow: #FFF1C5;
  --green: #D8F3DC;
  --red: #FDECEF;
  --lav: #EDE4F7;
  --good: #6FB58A;
  --bad: #E2828F;
  --gold: #F2C14E;
  --night: #2B2433;
  --led: #FF6B6B;
  --edge: #EFE6DD;
  --edge-2: #E3D8CE;
  --shadow: 0 4px 0 #EDE2D7, 0 12px 26px rgba(120,90,80,.07);
  --shadow-sm: 0 3px 0 #E8DED4;
  --line: 2px solid var(--edge);
  --pinkfill: #F4A3B5;
  --r: 24px;
  --font: "M PLUS Rounded 1c", "Huninn", "Noto Sans TC", "Noto Sans HK", ui-rounded, system-ui, sans-serif;
  --zh: "Huninn", "Noto Sans TC", "Noto Sans HK", "PingFang HK", "Microsoft JhengHei", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--cream); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance; font-weight: 800; }
p { margin: 0; }
.zh { font-family: var(--zh); font-weight: 500; }
.muted { color: var(--ink-soft); }
.small { font-size: .86rem; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

/* ---------- Buttons ---------- */
.btn {
  --bx: #DE95A2; background: var(--pink); border: 2px solid var(--rose); border-radius: 18px; box-shadow: 0 4px 0 var(--bx);
  padding: 10px 18px; font-weight: 800; min-height: 48px; transition: transform .08s ease-out, box-shadow .08s ease-out, filter .15s;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 0 var(--bx); }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--bx); }
.btn.blue { --bx: #6CC3EE; background: var(--blue); border-color: #84D8FF; }
.btn.yellow { --bx: #E2C561; background: var(--yellow); border-color: #EBD89A; }
.btn.plain { --bx: var(--edge-2); background: #fff; border-color: var(--edge); }
.btn:disabled { box-shadow: 0 4px 0 #E5E5E5; transform: none; filter: saturate(.35); opacity: .65; cursor: not-allowed; }
.btn .ic { width: 22px; height: 22px; }
.btn.big { font-size: 1.1rem; padding: 12px 24px; }
.iconbtn {
  background: #fff; border: var(--line); border-radius: 14px; box-shadow: var(--shadow-sm);
  min-width: 44px; min-height: 44px; padding: 4px 10px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.iconbtn:active { transform: translateY(3px); box-shadow: none; }
.iconbtn .ic { width: 22px; height: 22px; }
.ic { width: 1.3em; height: 1.3em; display: inline-block; vertical-align: -.3em; flex: none; overflow: visible; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- Top bar ---------- */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  background: rgba(255,253,246,.92); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid #EADFD6;
}
.brand { background: none; border: 0; padding: 0; font-weight: 800; font-size: 18px; line-height: 1.2; text-align: left; display: flex; align-items: center; gap: 6px; }
.brand small { font-weight: 700; color: var(--ink-soft); font-size: 12px; }
.brand svg { width: 34px; height: 34px; overflow: visible; }
.brand .fr-rainbow, .brand .fr-laser, .brand .fr-sakura, .brand .fr-neon, .brand .fr-galaxy { display: inline-flex; padding: 2px; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 4px; border: var(--line); border-radius: 999px; padding: 4px 10px; font-weight: 800; font-size: 14px; background: #fff; box-shadow: var(--shadow-sm); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill .ic { width: 20px; height: 20px; }
.pill.fire { background: #FFF0DD; border-color: #FFC68A; box-shadow: 0 3px 0 #F5A44B; color: #A24F00; }
.pill.saved { background: #EAF8DD; border-color: #C7E9A8; box-shadow: 0 3px 0 #A9D98A; color: #2F6B00; animation: pop .4s ease-out; }
@media (max-width: 560px) { .tools .lbl { display: none; } .brand .bt { display: none; } .tools { gap: 6px; } .iconbtn { min-width: 42px; padding: 4px 8px; } }

main { max-width: 1040px; margin: 0 auto; padding: 14px 16px 40px; display: grid; gap: 16px; }
.card { background: #fff; border: 2px solid #F3EAE1; border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card.cream { background: var(--cream-2); }

/* ---------- Speech ---------- */
.say { display: flex; gap: 12px; align-items: flex-start; }
.say .av { flex: 0 0 56px; width: 56px; height: 56px; animation: bob 2.4s ease-in-out infinite; }
.say .av svg { width: 100%; height: 100%; overflow: visible; }
.bubble { position: relative; background: #fff; border: 2px solid #EFEFEF; border-radius: 16px; padding: 8px 12px; box-shadow: 0 3px 0 #E5E5E5; min-width: 0; }
.bubble::before { content: ""; position: absolute; left: -11px; top: 16px; border: 9px solid transparent; border-right-color: #EFEFEF; border-left: 0; }
.bubble::after { content: ""; position: absolute; left: -6px; top: 18px; border: 7px solid transparent; border-right-color: #fff; border-left: 0; }
.bubble .name { display: block; font-size: .78rem; font-weight: 800; color: var(--ink-soft); }
.bubble.hint { background: var(--blue-2); }
.bubble.hint::after { border-right-color: var(--blue-2); }

/* ---------- Title / map ---------- */
.hero { background: linear-gradient(120deg, #FFF1C2, #FFD6EA 45%, #DCD2FF); color: var(--ink); border: 3px solid #fff; border-radius: 28px; box-shadow: 0 5px 0 #E9C4DA, 0 14px 28px rgba(200,120,170,.18); padding: 22px 18px 0; overflow: hidden; position: relative; display: grid; gap: 8px; }
.hero h1 { font-size: clamp(1.7rem, 5.5vw, 2.6rem); position: relative; }
.hero .sub { color: #8C3B6A; font-weight: 800; position: relative; }
.hero .kicker { color: #8C3B6A; }
.hero .stars { position: absolute; inset: 0; pointer-events: none; }
.hero .stars span { position: absolute; color: #fff; text-shadow: 0 0 6px rgba(255,200,0,.7); animation: twinkle 2.6s ease-in-out infinite; }
.cast { display: flex; justify-content: center; align-items: flex-end; margin-top: 6px; position: relative; }
.cast .fig { width: clamp(64px, 16vw, 120px); margin: 0 -4px; animation: bob 2.6s ease-in-out infinite; }
.cast .fig:nth-child(2) { animation-delay: -.6s; } .cast .fig:nth-child(3) { animation-delay: -1.2s; width: clamp(76px, 19vw, 140px); }
.cast .fig:nth-child(4) { animation-delay: -1.8s; } .cast .fig:nth-child(5) { animation-delay: -2.2s; }
.cast .fig svg { width: 100%; height: auto; display: block; overflow: visible; }
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.topic {
  text-align: left; background: #fff; border: var(--line); border-radius: 20px; box-shadow: var(--shadow);
  padding: 14px; display: grid; gap: 6px; align-content: start; transition: transform .12s, box-shadow .12s;
}
.topic:hover:not(:disabled) { transform: translateY(-2px); }
.topic.next { background: #FFF8DA; border-color: #FFE27A; box-shadow: 0 4px 0 #F5CF4B, 0 12px 26px rgba(120,90,80,.07); }
.topic.done { background: #E6F5EA; border-color: #A9D3B3; box-shadow: 0 4px 0 #8FC59C, 0 12px 26px rgba(120,90,80,.07); }
.topic:disabled { opacity: .55; cursor: not-allowed; }
.topic .tnum { font-size: .8rem; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; }
.topic .tname { font-weight: 800; font-size: 1.05rem; }
.topic .rstars { font-size: 1.1rem; letter-spacing: 2px; }
.bag { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { border: 0; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 800; background: var(--lav); display: inline-flex; align-items: center; gap: 4px; }

/* ---------- Room view ---------- */
.roomhead {
  background: var(--night); color: #fff; border: 3px solid #fff; border-radius: var(--r); box-shadow: var(--shadow);
  padding: 10px 14px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center;
  background-image: radial-gradient(circle at 12% 0%, rgba(255,107,107,.35), transparent 45%), radial-gradient(circle at 90% 100%, rgba(160,196,255,.25), transparent 50%);
}
.roomhead .rt { font-weight: 800; font-size: 1.05rem; }
.roomhead .rtopic { font-size: .85rem; color: var(--yellow); }
.timer {
  font-variant-numeric: tabular-nums; font-weight: 800; font-size: clamp(1.4rem, 5vw, 2rem); letter-spacing: .06em;
  background: #120e17; color: var(--led); border: 3px solid #000; border-radius: 12px; padding: 2px 12px;
  text-shadow: 0 0 8px rgba(255,107,107,.9), 0 0 18px rgba(255,107,107,.5); box-shadow: inset 0 0 12px rgba(255,107,107,.25);
}
.timer.low { animation: blink 1s steps(2, start) infinite; }
.timer.over { color: var(--yellow); font-size: clamp(1rem, 3.6vw, 1.4rem); text-shadow: 0 0 8px rgba(253,255,182,.8); }
.status { display: flex; gap: 10px; align-items: center; min-width: 0; }
.status .av { width: 64px; height: 64px; flex: 0 0 64px; }
.status .av svg { width: 100%; height: 100%; overflow: visible; }
.scene-wrap { border: 3px solid #fff; border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; background: var(--night); }
.scene { position: relative; width: 100%; aspect-ratio: 8 / 5; max-width: 100%; }
.scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scene .obj { cursor: pointer; }
.scene .obj:hover { filter: brightness(1.12); }
.dark {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at var(--sx, 50%) var(--sy, 45%), rgba(20,14,28,0) 0, rgba(20,14,28,0) 16%, rgba(20,14,28,var(--dim, .5)) 46%);
}
.hs {
  position: absolute; transform: translate(-50%, -50%); width: 46px; height: 46px; border-radius: 50%;
  border: var(--line); background: var(--yellow); box-shadow: var(--shadow-sm); font-weight: 800; font-size: 1.2rem;
  display: grid; place-items: center; animation: glow 1.8s ease-in-out infinite; padding: 0;
}
.hs.done { background: var(--green); animation: none; }
.hs.door { background: var(--pink); }
.hs .lbl { position: absolute; top: 100%; margin-top: 4px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: .72rem; background: var(--cream); border: 2px solid var(--edge); border-radius: 8px; padding: 0 6px; }
@media (max-width: 560px) { .hs { width: 38px; height: 38px; font-size: 1rem; } .hs .lbl { display: none; } }
.inv { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.slot {
  border: 3px dashed var(--edge-2); border-radius: 16px; min-height: 80px; display: grid; place-items: center; align-content: center; gap: 2px; text-align: center;
  padding: 6px 4px; font-size: .74rem; font-weight: 700; background: var(--cream); line-height: 1.2; min-width: 0;
}
.slot.full { border-style: solid; border-color: var(--edge); background: #fff; box-shadow: var(--shadow-sm); }
.slot.new { animation: pop .5s ease-out; }
.slot svg { width: 30px; height: 30px; }
.slot .code { display: inline-block; background: var(--yellow); border: 2px solid var(--edge); border-radius: 6px; padding: 0 5px; font-size: .8rem; font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { .slot .nm { display: none; } }

/* ---------- Modals ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(91,75,73,.35); display: grid; place-items: end center; padding: env(safe-area-inset-top, 0px) 0 0; overflow-y: auto; }
@media (min-width: 700px) { .overlay { place-items: center; padding: 24px; } }
.overlay.top { z-index: 60; }
.modal {
  background: var(--cream); border: 0; border-radius: 28px 28px 0 0; box-shadow: 0 -10px 30px rgba(91,75,73,.16);
  width: min(680px, 100%); max-height: calc(100dvh - 16px); overflow-y: auto; padding: 18px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px;
  animation: up .35s cubic-bezier(.3,1.3,.5,1); position: relative;
}
.modal.wide { width: min(760px, 100%); }
@media (min-width: 700px) { .modal { border-radius: 28px; max-height: 92vh; box-shadow: 0 20px 50px rgba(91,75,73,.22); } }
@keyframes up { 0% { transform: translateY(40px); opacity: 0; } 100% { transform: none; opacity: 1; } }
.modal .x { position: absolute; top: 10px; right: 10px; }
.modal h2 { padding-right: 52px; }
.kicker { font-size: .78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); padding-right: 52px; }
.q { font-weight: 800; font-size: 1.06rem; }
.choices { display: grid; gap: 10px; }
@media (min-width: 640px) { .choices { grid-template-columns: 1fr 1fr; } }
.choice { text-align: left; background: #fff; border: var(--line); border-radius: 18px; box-shadow: 0 3px 0 var(--edge); padding: 12px 14px; min-height: 56px; display: flex; gap: 10px; align-items: center; font-weight: 700; transition: transform .18s cubic-bezier(.3,1.6,.5,1); }
.choice:hover:not(:disabled) { transform: translateY(-2px); }
.choice b { flex: none; width: 30px; height: 30px; border-radius: 10px; background: var(--yellow); display: grid; place-items: center; font-size: 14px; }
.choice.right { background: #E6F5EA; border-color: var(--good); box-shadow: 0 3px 0 var(--good); }
.choice.wrong { background: #FDECEF; border-color: var(--bad); box-shadow: 0 3px 0 var(--bad); animation: shake .35s; }
.choice:disabled { cursor: default; }
.keypad { display: grid; gap: 10px; justify-items: center; }
.kdisplay {
  width: min(280px, 100%); background: #120e17; color: var(--led); border: 3px solid #000; border-radius: 12px; padding: 6px 12px;
  font-size: 1.7rem; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; min-height: 56px; letter-spacing: .08em;
  text-shadow: 0 0 8px rgba(255,107,107,.8);
}
.kdisplay .u { color: var(--yellow); font-size: .9rem; margin-left: 6px; text-shadow: none; letter-spacing: 0; }
.keys { display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; }
.key { height: 54px; border: var(--line); border-radius: 12px; background: #fff; box-shadow: var(--shadow-sm); font-weight: 800; font-size: 1.2rem; }
.key:active { transform: translateY(3px); box-shadow: none; }
.key.del { background: var(--pink-2); }
.dials { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.dial { display: grid; gap: 6px; justify-items: center; }
.dial .dlabel { font-size: .8rem; font-weight: 800; background: var(--yellow); border: 2px solid var(--edge); border-radius: 8px; padding: 0 8px; text-align: center; }
.dial .face { min-width: 128px; background: #fff; border: var(--line); border-radius: 14px; box-shadow: inset 0 -6px 0 var(--cream-2); padding: 12px 10px; font-weight: 800; text-align: center; font-size: 1.05rem; }
@media (max-width: 560px) { .dials { flex-direction: column; align-items: stretch; } .dial { grid-template-columns: 48px 1fr 48px; align-items: center; } .dial .dlabel { grid-column: 1 / -1; justify-self: center; } .dial .face { min-width: 0; padding: 8px 6px; } .dial .arr { width: 48px; } }
.dial .face.spin { animation: spin .25s ease-out; }
.dial .arr { width: 56px; height: 38px; border: var(--line); border-radius: 10px; background: var(--blue); box-shadow: var(--shadow-sm); font-weight: 800; }
.fb { border: 0; border-radius: 18px; padding: 12px 14px; display: grid; gap: 10px; animation: popin .3s; }
.fb.ok { background: #E6F5EA; } .fb.no { background: #FDECEF; }
@keyframes popin { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.terms { display: flex; flex-wrap: wrap; gap: 6px; }
.term { border: 2px solid var(--edge); border-radius: 10px; padding: 2px 8px; font-size: .88rem; background: #fff; }
.term .zh { margin-left: 5px; color: #A23E60; }
.tip { border: 2px dashed var(--edge-2); background: var(--yellow); border-radius: 12px; padding: 8px 12px; font-size: .92rem; }
.diagram-box { overflow-x: auto; background: #fff; border: 2px solid var(--edge); border-radius: 12px; padding: 6px; }
.diagram { display: block; width: 100%; max-width: 440px; height: auto; margin: 0 auto; }
.modal.shake { animation: shake .45s ease-in-out; }
.found { background: #fff; border: 2px solid var(--edge); border-radius: 12px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; }
.found svg { width: 32px; height: 32px; flex: 0 0 32px; }

/* Journal */
.tabs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
.tab { flex: 0 0 auto; border: 2px solid var(--edge); border-radius: 999px; background: #fff; padding: 6px 14px; min-height: 44px; font-weight: 800; font-size: 14px; box-shadow: var(--shadow-sm); transition: transform .08s, box-shadow .08s; }
.tab[aria-selected="true"] { transform: translateY(3px); box-shadow: none; background: var(--pink); border-color: var(--rose); color: #8C3B4C; }
.jsec { display: grid; gap: 6px; }
.jsec h3 { font-size: 1rem; }
.jsec ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.formula { font-weight: 800; background: #fff; border: 2px solid var(--edge); border-radius: 10px; padding: 6px 10px; font-variant-numeric: tabular-nums; }
.tterms { width: 100%; border-collapse: collapse; font-size: .92rem; }
.tterms td { border-bottom: 1px solid #E5DCC9; padding: 4px 6px; }
.tterms tr.hl td { background: var(--yellow); font-weight: 800; }

/* Save code */
.codebox { display: flex; gap: 8px; justify-content: center; }
.codebox span { width: 52px; height: 64px; display: grid; place-items: center; border: var(--line); border-radius: 12px; background: #fff; box-shadow: var(--shadow-sm); font-size: 1.9rem; font-weight: 800; }
.codein { font: inherit; font-size: 1.5rem; font-weight: 800; letter-spacing: .3em; text-transform: uppercase; text-align: center; width: 220px; max-width: 100%; border: var(--line); border-radius: 14px; padding: 8px; background: #fff; color: var(--ink); }
.linkbox { font-size: .82rem; word-break: break-all; background: #fff; border: 2px solid var(--edge); border-radius: 10px; padding: 6px 10px; user-select: all; }
input.name { font: inherit; font-size: 16px; border: var(--line); border-radius: 14px; padding: 10px 12px; width: 100%; max-width: 320px; background: #fff; color: var(--ink); min-height: 48px; }
.preview { background: #fff; border: 2px solid var(--edge); border-radius: 12px; padding: 8px 12px; }

/* Celebration */
.yaha { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; pointer-events: none; }
.yaha .inner { display: grid; justify-items: center; animation: jump 1.2s ease-out forwards; }
.yaha .inner svg { width: 140px; height: auto; overflow: visible; }
.yaha .word { font-size: 3rem; font-weight: 800; color: var(--ink); background: var(--yellow); border: var(--line); border-radius: 20px; padding: 0 18px; box-shadow: var(--shadow); transform: rotate(-6deg); }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 80; }
.toast { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 90; background: #fff; color: var(--ink); padding: 10px 16px; border-radius: 18px; box-shadow: var(--shadow); font-weight: 700; max-width: calc(100% - 32px); }
footer { text-align: center; font-size: .78rem; color: var(--ink-soft); padding: 0 16px 24px; }

.door-panel { transform-box: fill-box; transform-origin: left center; transition: transform .9s ease-in; }
.door-open .door-panel { transform: scaleX(.12); }
.door-light { opacity: 0; transition: opacity .9s; }
.door-open .door-light { opacity: 1; }

/* Trophy cabinet */
.cabinet { background: linear-gradient(#FFF6DA, #FFF6DA) padding-box; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.trophy {
  background: #fff; border: var(--line); border-radius: 18px; box-shadow: var(--shadow-sm); padding: 10px 10px 12px;
  display: grid; gap: 4px; justify-items: center; text-align: center; position: relative; align-content: start;
}
.trophy::after { content: ""; position: absolute; left: 10px; right: 10px; top: 118px; height: 8px; background: #C98F6B; border: 2px solid var(--edge); border-radius: 4px; }
.trophy svg.cup { width: 96px; height: 116px; overflow: visible; }

    out.gain.cancelScheduledValues(ctx.currentTime); out.gain.setTargetAtTime(.55, ctx.currentTime, .8);
    this.next = ctx.currentTime + .15; this.timer = setInterval(() => this.schedule(), 150);
  },
  stop() {
    if (this.out && SFX.ctx) this.out.gain.setTargetAtTime(0, SFX.ctx.currentTime, .3);
    clearInterval(this.timer); this.timer = null;
  },
  setMode(m) { if (this.mode === m) return; this.mode = m; this.step = 0; },
  track: null,
  setTrack(t) { const id = t && t !== "classic" ? t : null; if (this.track === id) return; this.track = id; this.step = 0; },
  preview(t) {
    if (!this.on) { toast(L("Turn on 🎵 music first", "請先開啟 🎵 音樂")); return; }
    this.setTrack(t); this.start(); clearTimeout(this._pv);
    this._pv = setTimeout(() => this.setTrack(S && S.track), 15000);
  }
};

      "詞語：<b>入射線</b>、<b>反射線</b>、<b>法線</b>（在入射點與反射面垂直的假想線）、<b>入射角</b> <i>i</i> 和<b>反射角</b> <i>r</i>（兩者都與法線量度）。",
      "<b>反射定律：</b>(1) 入射線、反射線和法線三者都在同一平面上；(2) 反射角等於入射角（<i>r</i> = <i>i</i>）。",
      "平面鏡形成的像：與物體<b>大小相同</b>、<b>橫向倒置</b>、是<b>虛像</b>、位於<b>鏡子後方</b>，而且像距等於物距。",
      "在光線圖中，真實光線用帶箭號的實線表示；虛擬光線用沒有箭號的虛線表示。",
      "應用：用鏡子整理儀容、汽車<b>後視鏡</b>、<b>牙醫口腔鏡</b>、令房間看起來更寬敞的鏡子、把陽光引入室內的反光板、<b>潛望鏡</b>、<b>萬花筒</b>。"
    ],
    rules: ["反射定律：入射線、反射線和法線在同一平面上 · r = i", "平面鏡的像：大小相同 · 橫向倒置 · 虛像 · 在鏡後 · 像距 = 物距"],
    puzzles: [
      { q: "以下哪一項是反射定律？", choices: ["入射角等於反射角", "反射線永遠沿鏡面前進", "入射線和反射線永遠平行", "角度從鏡面量度"], hint: "法線是垂直於鏡面的線。兩個角的大小有甚麼關係？", explain: "入射角 = 反射角，兩者都從法線量度。" },
      { q: "一條光線射向平面鏡（見圖）。A、B、C 中哪一條是反射線？", choices: ["光線 A", "光線 B", "光線 C", "都不是"], hint: "看看入射線與虛線法線之間的角。反射線在法線另一邊形成相同的角。", explain: "光線 B 在法線另一邊與法線形成相同的角，這就是反射定律。" },
      { q: "轉動密碼盤，描述泡芙在平面鏡中的像。", labels: ["種類", "左右", "大小"], dials: [["實像", "虛像"], ["沒有倒置", "橫向倒置"], ["放大", "大小相同", "縮小"]], hint: "你能把鏡中的像投射在紙上嗎？你舉起右手時，鏡中像看來像舉起左手嗎？像比你大嗎？", explain: "像是虛像（不能投射在屏幕上）、橫向倒置、大小相同。所以救護車車頭的字是反轉印刷的：前面的司機從後視鏡看便會看到正確的字。" },
      { q: "一間小咖啡店用一大面鏡子鋪滿整幅牆。為甚麼咖啡店看起來大了很多？", choices: ["鏡子把枱放大了", "房間的像出現在鏡後，距離與房間在鏡前一樣，所以房間看來深了約一倍", "鏡子增加了光，令房間變大", "鏡中的像是實像，客人可以走進去"], hint: "平面鏡的像出現在鏡前、鏡上，還是鏡後？", explain: "平面鏡的像出現在鏡後，距離等於物體在鏡前的距離。鏡子「多出」一個房間，所以咖啡店看起來更深。" },
      { q: "芒芒做了一個潛望鏡，想從牆後偷看。兩面平面鏡是怎樣擺放的？", choices: ["互相平行並相對，各傾斜 45°", "兩面都平放在地上", "互成直角，背對背", "一面就夠了，另一面只是裝飾"], hint: "光從頂部進入，向下轉，再轉入你的眼睛。兩次轉向的方式相同。", explain: "兩面鏡互相平行，各傾斜 45°。每面鏡把光轉一個直角，所以牆上方的光能到達下方的眼睛。" }] },
  room3: { name: "彎曲水池", specialName: "水缸", specialLine: "水缸底有一條鎖匙……但它看起來比實際近！", badge: "💧 水滴潛水員徽章", item: "💎 水滴寶石",
    intro: [["usagi", "happy", "嘩！*撲向水缸裏的鎖匙，撲空了*"], ["hachiware", "normal", "鎖匙看起來比實際近……這是折射！光進入另一種介質時會偏折。"], ["chiikawa", "normal", "呀……我來拿毛巾吧。🫧"]],
    notes: [
      "光由一種<b>介質</b>進入另一種介質時，傳播方向發生偏折，稱為<b>折射</b>（介質例如空氣、水、玻璃）。",
      "光進入<b>折射率較高</b>的介質（例如空氣 → 水或玻璃）時，會<b>偏向法線</b>。",
      "光進入<b>折射率較低</b>的介質（例如水或玻璃 → 空氣）時，會<b>偏離法線</b>。沿法線入射的光線不會偏折。",
      "<b>折射率</b>表示介質使光偏折的能力：真空 1、空氣約 1、水 1.33、菜油 1.47、有機玻璃 1.50、玻璃 1.50–1.70、鑽石 2.42。折射率愈高，光從空氣進入時偏折幅度愈大。",
      "<b>斯涅耳定律：</b>sin <i>i</i> ÷ sin <i>r</i> = 常數。",
      "現象：水中物體看起來較接近水面；吸管和筷子看似折曲；透過玻璃塊看文字，文字看似較高；星星閃爍；透過熱空氣看物體會模糊或晃動。"
    ],
    rules: ["折射率低 → 高：偏向法線", "折射率高 → 低：偏離法線", "沿法線：不偏折"],
    puzzles: [
      { q: "一條光線斜斜地從空氣射進玻璃。玻璃的折射率較高。會發生甚麼事？", choices: ["偏離法線", "偏向法線", "完全不偏折", "一定會全部反射"], hint: "進入折射率較高的介質……偏向還是偏離法線？", explain: "進入折射率較高的介質（空氣 → 玻璃）時，光會偏向法線。" },
      { q: "玻璃磚內的光線到達頂面（見圖）。在空氣中它會走 A、B 還是 C？", choices: ["路徑 A", "路徑 B", "路徑 C", "停在表面"], hint: "玻璃 → 空氣是進入折射率較低的介質。偏向還是偏離虛線法線？", explain: "路徑 A 偏離法線，這正是光從玻璃進入空氣時發生的事。路徑 B 完全沒有偏折；路徑 C 偏折方向錯了。" },
      { q: "為甚麼水缸看起來比實際淺？", choices: ["缸底的光離開水面時偏離法線，所以缸底看來較高", "水吸收了紅光", "光離開水面時偏向法線", "水面反射了所有光"], hint: "光從水進入空氣時向哪邊偏折？眼睛會沿直線追溯光線。", explain: "缸底的光離開水面時偏離法線。眼睛沿直線追溯光線，所以缸底看來較高：水缸看起來較淺。" },
      { q: "泡芙把筷子放進一碗水裏，筷子在水面位置看起來彎了。為甚麼？", choices: ["水真的把筷子弄彎了", "水中部分的光離開水面時折射，所以那部分看來較高", "筷子在水中吸收了光", "光在水中沿曲線傳播"], hint: "和水缸看起來較淺的原理一樣！", explain: "水中部分的光離開水面時偏離法線，那部分看來比實際高，所以筷子在水面位置看起來彎曲。" },
      { q: "一條光線沿法線射向玻璃磚。會發生甚麼事？", choices: ["偏向法線", "偏離法線", "直線穿過，不會偏折", "發生全內反射"], hint: "如果光線已經沿法線前進，它可以向哪邊偏折？", explain: "沿法線前進的光線穿過界面時方向不變。" }] },
  room4: { name: "水晶光纖隧道", specialName: "水晶", specialLine: "光在這塊水晶裏來回曲折。它被困住了！", badge: "🌟 光纖守護者徽章", item: "🧵 發光光纖線",
    intro: [["chiikawa", "happy", "哇……光在水晶裏左右來回走！✨"], ["hachiware", "normal", "這是全內反射！光纖就是這樣傳送數據的。"], ["usagi", "happy", "嘩呼！💫"]],
    notes: [
      "光從折射率較高的介質射向折射率較低的介質時，完全反射回原來介質中，稱為<b>全內反射</b>。",
      "當折射角等於 90° 時的入射角，稱為<b>臨界角</b> <i>C</i>。",
      "全內反射必須<b>同時</b>符合兩個條件：(1) 光從折射率<b>較高</b>的介質傳播到折射率<b>較低</b>的介質；(2) 入射角<b>大於臨界角</b>（<i>i</i> > <i>C</i>）。",
      "介質折射率愈高，與空氣交界面的臨界角<b>愈小</b>：水 48.8°、菜油 42.9°、玻璃 41.8°–36.0°、鑽石 24.4°。",
      "應用：稜鏡潛望鏡、雙筒望遠鏡、單車反光板和高速公路貓眼石內的<b>三稜鏡</b>；<b>鑽石閃耀</b>；潛水員看到水面像鏡子；<b>光纖</b>用於電訊服務、互聯網通訊和醫療內窺鏡。"
    ],
    rules: ["條件一：折射率高 → 低", "條件二：入射角 > 臨界角", "折射率愈高 → 臨界角愈小"],
    puzzles: [
      { q: "以下哪一項列出全內反射的兩個條件？", choices: ["低 → 高折射率；入射角小於臨界角", "高 → 低折射率；入射角大於臨界角", "高 → 低折射率；光線沿法線", "任何介質；任何角度"], hint: "全內反射發生在玻璃或水的內部，當光線以大角度射向界面時。", explain: "全內反射需要光從折射率較高射向較低的介質（例如玻璃 → 空氣），而且入射角大於臨界角。" },
      { q: "把密碼鎖轉到能把光困在水晶內的條件。", labels: ["光的方向", "入射角"], dials: [["空氣 → 玻璃", "玻璃 → 空氣"], ["小於臨界角", "大於臨界角"]], hint: "光必須是想「離開」水晶，而且以大角度射向表面。", explain: "玻璃 → 空氣（高 → 低折射率），入射角大於臨界角：所有光都反射回內部。" },
      { q: "在水晶內，一條光線以小於臨界角的入射角射向與空氣的界面。會發生甚麼事？", choices: ["所有光都反射回內部", "大部分光折射進入空氣，偏離法線", "光停在界面", "光偏向法線"], hint: "全內反射的第二個條件不符合……", explain: "入射角太小，不會發生全內反射，所以大部分光折射進入空氣（偏離法線），只有少量被反射。" },
      { q: "光纖怎樣把互聯網數據以光的形式傳送到很遠的地方？", choices: ["光在每個彎位被吸收再重新產生", "光在光纖內不斷發生全內反射", "光纖外面鋪了平面鏡", "光自己會沿曲線走"], hint: "記得在水晶內來回曲折的光嗎？", explain: "光纖內的光射向界面時，入射角一直大於臨界角，所以不斷發生全內反射，光就留在光纖內。" },
      { q: "以下哪一項沒有利用全內反射？", choices: ["雙筒望遠鏡內的三稜鏡", "光纖", "鑽石的閃爍", "浴室的平面鏡"], hint: "其中一項是靠光亮的金屬塗層反射光。", explain: "浴室鏡子靠鍍銀表面反射光（普通反射）。雙筒望遠鏡和潛望鏡的三稜鏡、光纖和鑽石都利用全內反射。" }] },
  room5: { name: "透鏡工房", specialName: "透鏡架", specialLine: "架上有一塊大透鏡，透過它看甚麼都不一樣！", badge: "🔭 透鏡工匠徽章", item: "🔍 放大鏡",
    intro: [["hachiware", "normal", "這裏有很多透鏡！把光聚焦在每把鎖上吧。"], ["chiikawa", "happy", "呼哇……透過這塊看，甚麼都變大了！👀"], ["usagi", "happy", "嘩！嘩！🔎"]],
    notes: [
      "<b>凸透鏡</b>（會聚透鏡）：中心比邊緣厚。與<b>主軸</b>平行的光線穿過後會聚於<b>主焦點 F</b>；穿過<b>光心 C</b> 的光線方向不變。",
      "<b>焦距</b> <i>f</i> 是光心與主焦點之間的距離。透鏡兩側各有一個主焦點（F 和 F'）。",
      "凸透鏡成像：物體在 2F' 以外 → 縮小、倒立、實像；在 2F' → 與物體大小相同、倒立、實像（在 2F）；在 F' 和 2F' 之間 → 放大、倒立、實像；在 F' → 不形成清晰的像；在 F' 以內 → 放大、正立、虛像（與物體同側）。",
      "<b>實像</b>可投射到屏幕上，而且必定倒立；<b>虛像</b>不能。<b>放大率</b> = 像的高度 ÷ 物體的高度 = 像距 ÷ 物距（> 1 放大、= 1 大小相同、< 1 縮小）。",
      "<b>凹透鏡</b>（發散透鏡）：中心比邊緣薄。平行光線穿過後看似從 F' 發散出來。它只形成<b>正立、縮小的虛像</b>，而且與物體在同一側，所以放大率必定小於 1。",
      "應用：凸透鏡 —— 電筒、汽車車頭燈、遠視眼鏡、放大鏡、相機、顯微鏡、望遠鏡、雙筒望遠鏡、投影機；凹透鏡 —— 智能電話廣角鏡頭、專業相機鏡頭、大門防盜眼、近視眼鏡、使電筒光束發散。"
    ],
    rules: ["規則 1：平行光線 → 通過 F（凸）／看似來自 F'（凹）", "規則 2：穿過 F'（凸）／射向 F（凹）的光線 → 與主軸平行", "規則 3：穿過光心 C → 方向不變", "凹透鏡的像：必定正立 · 縮小 · 虛像"],
    puzzles: [
      { q: "平行於主軸的光線穿過凸透鏡（見圖）。它們在哪裏相交？", choices: ["光心", "主焦點 (F)", "永不相交", "返回光線原來的一邊"], hint: "凸透鏡是會聚透鏡。那個相交點叫「主……」", explain: "凸透鏡把平行光線會聚到一點：主焦點 F。" },
      { q: "轉動密碼盤，描述凹透鏡所成的像。", labels: ["種類", "方向", "大小"], dials: IMG3_ZH, hint: "凹透鏡把光散開，光線永遠不會真正相交……", explain: "無論物體在哪裏，凹透鏡永遠形成虛像、正立、縮小的像。" },
      { q: "要把凸透鏡當作放大鏡使用，物體應放在哪裏？", choices: ["離透鏡很遠", "比主焦點更接近透鏡", "剛好在主焦點", "在透鏡的另一邊"], hint: "放大鏡形成虛像、正立、放大的像。物體必須很近。", explain: "物體比 F 更接近凸透鏡時，透鏡形成虛像、正立、放大的像：這就是放大鏡。" },
      { q: "近視眼鏡和大門的防盜眼用的是哪種透鏡？", choices: ["凸透鏡", "凹透鏡", "平面鏡", "三稜鏡"], hint: "防盜眼把整個訪客顯示成一個細小、正立的影像……", explain: "凹透鏡使光發散。防盜眼用它顯示整個門口細小、正立的虛像；近視眼鏡用它在光進入眼睛前先把光散開。" },
      { q: "投影機用凸透鏡在屏幕上投射大畫面。轉動密碼盤，描述這個像。", labels: ["種類", "方向", "大小"], dials: IMG3_ZH, hint: "畫面出現在屏幕上，而且比幻燈片大。", explain: "投影機的像是實像（形成在屏幕上）、倒立和放大的。所以幻燈片要倒轉放入！" }] },
  room6: { name: "彩虹三稜鏡塔", specialName: "三稜鏡", specialLine: "一塊玻璃三稜鏡在牆上映出彩虹！", badge: "🌈 彩虹守護者徽章", item: "🔺 三稜鏡水晶",
    intro: [["momonga", "happy", "看我！我是最可愛的彩虹！🌈"], ["hachiware", "normal", "那是三稜鏡把白光分開，叫做色散！"], ["chiikawa", "happy", "呀……！好漂亮！✨"]],
    notes: [
      "人眼能看見的光稱為<b>可見光</b>。<b>白光</b>（例如太陽光）由多種不同顏色的光混合而成。",
      "白光穿過三稜鏡時，會分散成一道彩色光帶，稱為<b>可見光譜</b>（或<b>色譜</b>）：紅、橙、黃、綠、藍、靛、紫。紅光偏折最少，紫光偏折最多。",
      "光是一種波，不同顏色的光有不同<b>波長</b>：紅光波長最長（約 665 nm），紫光最短（約 400 nm）。",
      "光的<b>三原色</b>是紅、綠、藍。紅 + 綠 = 黃；紅 + 藍 = 洋紅；綠 + 藍 = 藍綠；紅 + 綠 + 藍 = 白。",
      "物體呈現的顏色取決於它<b>反射</b>甚麼顏色的光。白光下，紅色物體反射紅光、吸收其他色光；白色物體反射所有色光；黑色物體吸收所有色光。",

room2: [

[2,"Why is a plane mirror image called 'virtual'?",["Light only seems to come from behind the mirror, so it can't be caught on a screen","It is very small","It is upside down","It is brighter than the object"],"Where do the rays really meet?","The rays don't really meet behind the mirror; they only appear to, so the image is virtual.",

[2,"Why are angles of reflection measured from the normal?",["The normal gives the same right-angle reference for every ray","The mirror surface is invisible","It makes the angles bigger","There is no reason"],"A fixed reference line helps compare angles.","Measuring from the normal gives a consistent reference, so i = r always holds.",

[2,"If you move closer to a plane mirror, what happens to your image?",["It moves closer to the mirror too and stays the same size","It gets bigger","It moves further away","It turns upside down"],"Image distance = object distance.","The image is always as far behind the mirror as you are in front, and the same size.",

[2,"A ray hits a mirror along the normal. Where does it go?",["Straight back along the normal","Along the mirror surface","Through the mirror","It disappears"],"Angle of incidence is zero.","With a zero angle of incidence, the angle of reflection is also zero, so it goes straight back.",

[2,"Why can you see yourself in a smooth mirror but not in a sheet of paper?",["The mirror reflects light regularly; rough paper scatters it in all directions","Paper is luminous","Paper absorbs all light","Mirrors give out light"],"Smooth vs rough surfaces.","A smooth mirror keeps reflected rays in order, forming an image. Rough paper scatters them.",

[2,"On a hot summer day, why do things seen through the air above the road look wobbly?",["Light is refracted by the hot, moving air", "The road is melting", "Hot air reflects all the light", "Heat makes the road luminous"],"Hot air and cooler air bend light by different amounts.","Hot air and cooler air bend light by different amounts. As the air moves, the refraction keeps changing, so objects seen through it look blurred or wobbly.",
 "夏天透過路面上的熱空氣看東西，為甚麼會模糊晃動？",["光被流動的熱空氣折射", "路面正在熔化", "熱空氣反射了所有光", "熱力令路面成為發光體"],"熱空氣和較冷的空氣使光偏折的程度不同。","熱空氣和較冷的空氣使光偏折的程度不同。空氣流動時折射不斷改變，所以透過熱空氣看物體會模糊或晃動。"],
[2,"What does a higher refractive index tell us about a medium?",["It bends light more when light enters it from air", "It gives out more light", "It absorbs more colours", "Light cannot enter it"],"Refractive index = how strongly a medium bends light.","The refractive index shows how strongly a medium bends light. The higher it is, the more light bends when it enters from air.",

[2,"Why do we see a rainbow after rain?",["Water droplets disperse sunlight into colours","Clouds paint the sky","Rain is luminous","The Sun changes colour"],"Tiny prisms in the sky.","Raindrops act like tiny prisms and disperse sunlight.",
 "為甚麼雨後會看見彩虹？",["水點把陽光色散成多種顏色","雲把天空塗上顏色","雨是發光體","太陽變了顏色"],"天空中的小三稜鏡。","雨點像細小的三稜鏡，把陽光色散。"],
[2,"Red light + blue light = ?",["Magenta","Cyan","Yellow","Green"],"R + B...","Red + blue light = magenta.",
 "紅光 + 藍光 = ？",["洋紅","藍綠","黃","綠"],"紅 + 藍……","紅光 + 藍光 = 洋紅。"],
[2,"Why is white light called a 'mixture'?",["It contains all the colours of the spectrum together","It is a mix of dust and light","It is only red and blue","It has no colours in it"],"A prism shows what's inside.","White light contains all the spectrum colours mixed together.",
 "為甚麼白光被稱為「混合光」？",["它包含光譜中所有顏色","它是塵埃和光的混合","它只有紅和藍","它沒有任何顏色"],"三稜鏡顯示了它的成分。","白光包含光譜中所有顏色的混合。"],
[3,"A blue car is lit by red light only. What colour does it look?",["Black","Blue","Red","Purple"],"Is there blue light to reflect?","The blue car absorbs red and has no blue to reflect, so it looks black.",
 "一輛藍色汽車只被紅光照射，看起來是甚麼顏色？",["黑","藍","紅","紫"],"有藍光可以反射嗎？","藍色汽車吸收紅光，又沒有藍光可反射，所以看起來是黑色。"],
[3,"A yellow T-shirt is lit by green light only. What colour does it look?",["Green","Yellow","Black","Red"],"Yellow objects reflect red and green.","It can reflect the green light, so it looks green.",
 "一件黃色 T 恤只被綠光照射，看起來是甚麼顏色？",["綠","黃","黑","紅"],"黃色物體反射紅光和綠光。","它可以反射綠光，所以看起來是綠色。"],
[3,"A sheet of white paper is lit by magenta light. What colour does it look?",["Magenta","White","Black","Cyan"],"White reflects whatever shines on it.","White paper reflects the red and blue light, so it looks magenta.",
 "一張白紙被洋紅色光照射，看起來是甚麼顏色？",["洋紅","白","黑","藍綠"],"白色會反射照在它身上的光。","白紙反射紅光和藍光，所以看起來是洋紅色。"],
[3,"A yellow T-shirt is lit by blue light only. What colour does it look?",["Black", "Yellow", "Blue", "Green"],"A yellow object reflects red and green light.","A yellow object reflects red and green light and absorbs blue. Under blue light there is no red or green to reflect, so it looks black.",
 "一件黃色 T 恤只被藍光照射。它看起來是甚麼顏色？",["黑", "黃", "藍", "綠"],"黃色物體反射紅光和綠光。","黃色物體反射紅光和綠光，吸收藍光。在藍光下沒有紅光或綠光可以反射，所以它呈黑色。"],
[3,"A green leaf is lit by cyan light. What colour does it look?",["Green","Cyan","Blue","Black"],"Cyan = green + blue.","The leaf reflects the green part of the cyan light and absorbs the blue.",
 "一塊綠葉被藍綠色光照射，看起來是甚麼顏色？",["綠","藍綠","藍","黑"],"藍綠 = 綠 + 藍。","綠葉反射藍綠光中的綠光，吸收藍光。"],
[3,"Which two coloured lights mix to make yellow?",["Red and green","Blue and green","Red and blue","Blue and yellow"],"Not like paint!","Red + green light = yellow.",
 "哪兩種色光混合成黃色？",["紅和綠","藍和綠","紅和藍","藍和黃"],"和顏料不同！","紅光 + 綠光 = 黃。"],
[3,"Red, green and blue spotlights all shine on the same white wall. The wall looks...",["White","Black","Brown","Grey-green"],"All three primaries.","Red + green + blue light = white.",
 "紅、綠、藍三盞射燈同時照在白牆上，牆看起來是……",["白色","黑色","啡色","灰綠色"],"三種原色。","紅 + 綠 + 藍光 = 白。"],
[4,"A red apple looks black on stage. Which light could be shining on it?",["Blue light only","Red light only","White light","Yellow light"],"Which light has no red in it?","With no red light to reflect, the apple looks black. Blue light has no red.",
 "舞台上的紅蘋果看起來是黑色。照着它的可能是甚麼光？",["只有藍光","只有紅光","白光","黃光"],"哪種光不含紅光？","沒有紅光可反射，蘋果就看似黑色。藍光不含紅光。"],
[4,"An object looks red in white light and black in green light. What can you conclude?",["It reflects only red and absorbs green","It reflects green","It is white","It gives out red light"],"What does it reflect?","It reflects red only; under green light there is nothing it can reflect.",
 "一件物體在白光下是紅色，在綠光下是黑色。你可以得出甚麼結論？",["它只反射紅光，吸收綠光","它反射綠光","它是白色的","它發出紅光"],"它反射甚麼？","它只反射紅光；在綠光下沒有光可以反射。"],
[4,"A cyan object is lit by white light. Which colour does it absorb?",["Red","Green","Blue","None"],"Cyan = green + blue.","It reflects green and blue (cyan), so it absorbs red.",
 "一件藍綠色物體被白光照射，它吸收哪種顏色？",["紅","綠","藍","都不吸收"],"藍綠 = 綠 + 藍。","它反射綠光和藍光（藍綠色），所以吸收紅光。"],
[4,"Why does violet light bend more than red light in a prism?",["Glass slows violet light slightly more, so it refracts more","Violet light is heavier","Red light is absorbed","Violet light is luminous"],"More slowing = more bending.","Glass has a slightly higher refractive index for violet, so violet bends more.",
 "為甚麼在三稜鏡中紫光比紅光偏折得多？",["玻璃令紫光減速稍多，所以折射更多","紫光較重","紅光被吸收","紫光是發光體"],"減速越多，偏折越多。","玻璃對紫光的折射率稍高，所以紫光偏折更多。"],
[4,"A yellow bag looks red under one spotlight and green under another. Why?",["A yellow object reflects both red light and green light", "The bag changes its paint", "The bag gives out red and green light", "The bag absorbs red and green light"],"Which colours of light does a yellow object reflect?","A yellow object reflects red and green light. Under red light it can reflect red, so it looks red; under green light it looks green.",
 "一個黃色袋在一盞射燈下呈紅色，在另一盞下呈綠色。為甚麼？",["黃色物體能反射紅光和綠光", "袋子換了顏色", "袋子發出紅光和綠光", "袋子吸收紅光和綠光"],"黃色物體反射甚麼色光？","黃色物體能反射紅光和綠光。在紅光下它反射紅光，呈紅色；在綠光下呈綠色。"],
[4,"Mixing paints and mixing LIGHT give different results. Which is true for light?",["Adding more coloured lights makes it brighter, towards white","Adding more lights makes it darker, towards black","Red + green light = brown","Light mixes exactly like paint"],"Lights add together.","Mixing coloured lights adds light, heading towards white.",
 "混合顏料和混合色光的結果不同。以下哪一項對色光正確？",["加入更多色光會更亮，趨向白色","加入更多色光會更暗，趨向黑色","紅光 + 綠光 = 啡色","色光混合和顏料完全一樣"],"色光會相加。","混合色光是把光加起來，趨向白色。"],
[5,"A student says 'a red rose looks red because it absorbs red light.' Evaluate.",["Wrong: it reflects red light and absorbs the others","Right","Wrong: it gives out red light","Right: objects absorb their own colour"],"Seen colour = reflected colour.","We see the colour that is reflected. The rose reflects red and absorbs the rest.",
 "有同學說：「紅玫瑰看起來是紅色，因為它吸收紅光。」評論這個說法。",["錯：它反射紅光，吸收其他顏色","對","錯：它發出紅光","對：物體吸收自己的顏色"],"看見的顏色 = 反射的顏色。","我們看見被反射的顏色。玫瑰反射紅光，吸收其餘顏色。"],
[5,"A fruit stall wants its strawberries to look bright red. Which lighting works best?",["Light with plenty of red in it","Blue light only","Green light only","No light"],"Strawberries reflect red.","They need red light to reflect, so light rich in red makes them look bright red.",
 "水果檔想士多啤梨看起來鮮紅。哪種燈光最好？",["含大量紅光的燈光","只有藍光","只有綠光","沒有燈光"],"士多啤梨反射紅光。","要有紅光可反射，所以含大量紅光的燈光令它們看起來鮮紅。"],
[5,"Which evidence best supports 'white light is a mixture of colours'?",["A prism splits white light into a spectrum","White paper looks bright","Shadows are dark","Mirrors reflect white light"],"Take white light apart.","A prism separates white light into its colours, showing they were mixed in it.",
 "哪項證據最能支持「白光是多種顏色的混合」？",["三稜鏡把白光分成光譜","白紙看起來很亮","影子是暗的","鏡子反射白光"],"把白光拆開。","三稜鏡把白光分成各種顏色，證明它們本來混在一起。"],
[5,"Which statement is FALSE?",["A green object looks green under red light","Red + green light gives yellow","Violet bends more than red in a prism","A white object reflects all colours"],"Can a green object reflect red?","A green object absorbs red, so under red light it looks black, not green.",
 "以下哪一項是錯的？",["綠色物體在紅光下看起來是綠色","紅光 + 綠光 = 黃","在三稜鏡中紫光比紅光偏折得多","白色物體反射所有顏色"],"綠色物體能反射紅光嗎？","綠色物體吸收紅光，在紅光下看起來是黑色，不是綠色。"],
[5,"For a school play, which spotlights make a white costume look cyan?",["Green and blue","Red and green","Red and blue","Red only"],"Cyan = ?","A white costume reflects green + blue light, which looks cyan.",
 "學校話劇中，哪些射燈能令白色戲服看起來是藍綠色？",["綠和藍","紅和綠","紅和藍","只有紅"],"藍綠 = ？","白色戲服反射綠光 + 藍光，看起來是藍綠色。"],
[6,"Design a way to make a rainbow at home on a sunny day. Which works?",["Spray a fine water mist with the Sun behind you","Shine a torch at a mirror in the dark","Mix red and blue paints","Stare at a black wall"],"Make your own raindrops.","Water droplets disperse sunlight; with the Sun behind you, you'll see a rainbow.",
 "設計一個在晴天在家製造彩虹的方法。哪個可行？",["背向太陽噴出細水霧","在黑暗中用電筒照鏡子","混合紅色和藍色顏料","盯着黑色牆壁"],"自己製造雨點。","水點把陽光色散；背向太陽就能看見彩虹。"],
[6,"You want a message written in red ink on white paper to become invisible. Which light should you use?",["Red light: the paper and the ink both look red","Blue light","Green light","Complete darkness"],"Make the paper and ink the same colour.","Under red light, white paper reflects red and red ink reflects red, so they match.",
 "你想令寫在白紙上的紅色字消失。應該用哪種光？",["紅光：紙和墨水都看似紅色","藍光","綠光","完全黑暗"],"令紙和墨水變成同一顏色。","在紅光下，白紙和紅墨水都反射紅光，所以顏色一樣。"],
[6,"Design a colour-changing lamp using only three coloured LEDs. Which three?",["Red, green and blue","Red, yellow and blue","Cyan, magenta and yellow","White, black and grey"],"The primary colours of light.","Red, green and blue LEDs can mix to make many colours, including white.",
 "只用三粒彩色 LED 設計一盞變色燈。應選哪三種顏色？",["紅、綠、藍","紅、黃、藍","藍綠、洋紅、黃","白、黑、灰"],"光的三原色。","紅、綠、藍 LED 可混合出很多顏色，包括白色。"],
[6,"For a magic trick you want a green leaf to look black. Which light should you use?",["Red or blue light (no green)","Green light","White light","Cyan light"],"Take away the green.","Without green light to reflect, the leaf looks black.",
 "魔術表演中，你想令綠葉看起來是黑色。應該用哪種光？",["紅光或藍光（不含綠光）","綠光","白光","藍綠光"],"把綠光拿走。","沒有綠光可反射，葉就看起來是黑色。"]

[2,"From radio waves to gamma rays, the energy...",["increases","decreases","stays the same"],"Shorter wavelength, more energy.","Energy increases from radio waves to gamma rays.",

[2,"Why can too much ultraviolet radiation be harmful?",["It can cause sunburn, skin cancer, cataracts and damage to the retina", "It is too cold", "It is visible", "It has the longest wavelength"],"UV has a shorter wavelength and more energy than visible light.","Ultraviolet radiation has more energy than visible light. Too much can cause sunburn, skin cancer, cataracts and retina damage.",
 "為甚麼過量紫外輻射有害？",["它可引致曬傷、皮膚癌、白內障和損害視網膜", "它太冷", "它是可見的", "它的波長最長"],"紫外輻射的波長比可見光短，能量較高。","紫外輻射的能量比可見光高。過量接觸可引致曬傷、皮膚癌、白內障和損害視網膜。"],

[2,"Why are some foods treated with gamma rays?",["Gamma rays kill microorganisms, so the food keeps longer", "They make the food luminous", "They cook food like microwaves", "They add vitamins"],"Gamma rays have very high energy.","Gamma rays can kill microorganisms, so they are used for food preservation (and to sterilise medical tools).",
 "為甚麼有些食物會用伽瑪射線處理？",["伽瑪射線能殺滅微生物，令食物保存得更久", "令食物發光", "像微波一樣煮熟食物", "加入維他命"],"伽瑪射線的能量非常高。","伽瑪射線能殺滅微生物，所以可用於食物保存（和醫療器材消毒）。"],
[2,"An infrared thermometer checks your temperature without touching you. Why does this work?",["All objects give out infrared radiation, and hotter objects give out more", "It sends X-rays into your body", "It measures ultraviolet radiation from your skin", "It uses sound"],"Everything around you gives out infrared radiation.","All objects give out infrared radiation, and the hotter an object is, the more it gives out. The thermometer detects this to measure temperature.",
 "紅外線體溫計不用接觸便能量度體溫。為甚麼可行？",["所有物體都會發出紅外輻射，溫度愈高發出愈多", "它向身體發出 X 射線", "它量度皮膚發出的紫外輻射", "它利用聲音"],"身邊所有東西都會發出紅外輻射。","所有物體都會發出紅外輻射，溫度愈高發出愈多。體溫計偵測這些輻射來量度溫度。"],

 "家中汽車用「快易通」自動繳付隧道費。它使用哪種電磁波？",["無線電波", "X 射線", "伽瑪射線", "紫外輻射"],"它與八達通卡和 Wi-Fi 同屬一類。","無線電波常用於傳送數據，例如車輛自動繳費系統、八達通卡、Wi-Fi、藍牙和對講機。"],
[3,"Firefighters look for people in thick smoke with a special camera. Which wave does it use?",["Infrared radiation","Gamma rays","X-rays","Ultraviolet radiation"],"People are warm.","A thermal camera detects the infrared given out by warm bodies.",
 "消防員用特別的相機在濃煙中尋找人。它使用哪種電磁波？",["紅外輻射","伽瑪射線","X 射線","紫外輻射"],"人是溫暖的。","熱成像相機探測溫暖身體發出的紅外輻射。"],

 "機場保安不用打開行李就能檢查。用的是哪種電磁波？",["X 射線","無線電波","可見光","紅外輻射"],"它能看穿行李。","X 射線穿過行李，顯示裏面的物件。"],

/* Save code: 5 characters of Crockford base32 (no I, L, O, U) = 25 bits.
   Packs stars per room (0–3 × 7 rooms), locks solved in the current room (0–5),
   streak (0–79) and streak shields (0–3). Multiplied by a constant so codes look random. */
const B32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";

  return ((s0 % m) + m) % m;
}
const CODE_KINV = modInv(CODE_K, CODE_M);
function roomStars(r) {
  if (!S.completed_rooms.includes(r.id)) return 0;

  const n = r.puzzles.filter((_, i) => S.mastered_puzzles.includes(`${r.id}:c${i}`)).length;
  return n === 5 ? 3 : n >= 3 ? 2 : 1;

function makeCode() {

  const streak = Math.max(1, Math.min(79, S.current_streak));
  const shields = Math.max(0, Math.min(3, S.streak_shields));

  S.minfo = S.minfo || {}; const o = S.minfo[pid] || { n: 0 };

}
function clearMistake(pid) { S.mistakes = S.mistakes.filter(m => m !== pid); if (S.minfo) delete S.minfo[pid]; }

function practicePick() {
  const n = PR.served;
  const due = PR.pending.filter(x => x.due <= n).sort((a, b) => a.due - b.due)[0];
  if (due) { PR.pending = PR.pending.filter(x => x !== due); return [due.pid, true]; }
  while (PR.fresh.length) { const pid = PR.fresh.shift(); if (!PR.pending.some(x => x.pid === pid)) return [pid, false]; }
  const rooms = ROOMS.filter((r, i) => isUnlocked(i));
  const all = rooms.flatMap(r => r.pool.filter(practiceable).map(p => `${r.id}:${p.id}`));
  const cands = all.filter(pid => !PR.recent.includes(pid) && !PR.pending.some(x => x.pid === pid));
  return [pick(cands.length ? cands : all), false];
}

}
function practiceNext() {

document.getElementById("brandav").innerHTML = playerAv("happy");
function renderTools() {
  const justSaved = Date.now() - savedFlash < 2500;
  document.getElementById("tools").innerHTML = `
    ${S && justSaved ? `<span class="pill saved" title="${L("Your progress saves automatically on this device", "進度會自動儲存在這部裝置")}">${IC("check")}<span class="lbl">${L("Saved", "已儲存")}</span></span>` : ""}
    ${S && AUTH.user ? `<button class="pill acct${AUTH.stale ? " stale" : ""}" id="tAcct" aria-label="${L("Account", "帳戶")}: ${esc(dispName())}" title="${L("Account", "帳戶")}">${IC(AUTH.stale ? "warn" : AUTH.user.guest ? "user" : "cloud")}<span class="lbl">${esc(dispName())}</span></button>` : ""}
    ${S ? `<button class="iconbtn coinpill" id="tCoins" aria-label="${L("Chestnuts", "栗子")}: ${S.coins}" title="${L("Chestnuts", "栗子")}">${IC("coin")}${S.coins}</button>` : ""}
    ${S ? `<span class="pill fire" title="${L("Daily streak · chestnut bonus", "連續日數 · 栗子加成")}">${IC("flame")}${S.current_streak}${streakMult() > 1 ? `<span class="lbl"> ×${streakMult().toFixed(1)}</span>` : ""}</span>` : ""}
    <button class="iconbtn" id="tJournal" aria-label="${L("Open the Study Journal", "打開學習日誌")}" title="${L("Study Journal", "學習日誌")}">${IC("book")}</button>
    <button class="iconbtn" id="tLang" aria-label="${L("Switch to Traditional Chinese", "Switch to English")}" title="${L("Language", "語言")}">${L("中文", "EN")}</button>
    <button class="iconbtn" id="tSnd" aria-label="${SFX.on ? L("Turn sound effects off", "關閉音效") : L("Turn sound effects on", "開啟音效")}" title="${L("Sound effects", "音效")}">${SFX.on ? IC("sound") : IC("mute")}</button>
    <button class="iconbtn" id="tMus" aria-label="${MUSIC.on ? L("Turn music off", "關閉音樂") : L("Turn music on", "開啟音樂")}" title="${L("Background music", "背景音樂")}" aria-pressed="${MUSIC.on}">${MUSIC.on ? IC("music") : `<span style="opacity:.35">${IC("music")}</span>`}</button>
    ${S ? `<button class="iconbtn" id="tSave" aria-label="${L("Save and share code", "儲存及分享代碼")}" title="${L("Save code", "存檔代碼")}">${IC("save")}</button>` : ""}`;
  document.getElementById("tJournal").onclick = () => { SFX.init(); SFX.tap(); openJournal(); };
  const tc = document.getElementById("tCoins"); if (tc) tc.onclick = () => { SFX.init(); SFX.tap(); openShop(); };
  const tt = document.getElementById("tTrophy"); if (tt) tt.onclick = () => { SFX.init(); SFX.tap(); openCabinet(); };
  const ta = document.getElementById("tAcct"); if (ta) ta.onclick = () => { SFX.init(); SFX.tap(); openAccount(); };
  const ts = document.getElementById("tSave"); if (ts) ts.onclick = () => { SFX.init(); SFX.tap(); openSaveModal(); };
  document.getElementById("tLang").onclick = () => { SFX.init(); SFX.tap(); setLang(LANG === "zh" ? "en" : "zh"); };
  document.getElementById("tMus").onclick = () => {
    MUSIC.on = !MUSIC.on; try { localStorage.setItem(MUSIC_KEY, MUSIC.on ? "on" : "off"); } catch (e) {}
    MUSIC.on ? MUSIC.start() : MUSIC.stop(); renderTools();
  };
  document.getElementById("tSnd").onclick = () => {
    SFX.on = !SFX.on; try { localStorage.setItem(SOUND_KEY, SFX.on ? "on" : "off"); } catch (e) {}
    if (SFX.on) { SFX.init(); SFX.tap(); } renderTools();
  };
  clearTimeout(renderTools._t);
  if (justSaved) renderTools._t = setTimeout(renderTools, 2600);
}

   8. Modals
   ============================================================ */
function openModal(html, { wide = false, closable = true, onClose = null } = {}) {
  $modal.innerHTML = `<div class="overlay" id="ov"><div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true" id="mbox">
    ${closable ? `<button class="iconbtn x" id="mx" aria-label="${L("Close", "關閉")}">✕</button>` : ""}${html}</div></div>`;
  const close = () => { closeModal(); onClose && onClose(); };
  if (closable) {
    document.getElementById("mx").onclick = () => { SFX.tap(); $modal._close && $modal._close(); };
    document.getElementById("ov").onclick = e => { if (e.target.id === "ov" && $modal._close) $modal._close(); };
  }
  $modal._close = closable ? close : null;
  const f = $modal.querySelector(".modal button:not(.x), .modal input"); if (f) f.focus({ preventScroll: true });
  return document.getElementById("mbox");
}
function closeModal() { $modal.innerHTML = ""; $modal._close = null; }
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($journal.innerHTML) { $journal.innerHTML = ""; return; }
  if ($modal._close) $modal._close();
});

/* ----- Study Journal / Textbook Helper ----- */
function openJournal(roomId, highlight = []) {
  let rid = roomId || (R ? R.room.id : (ROOMS[S ? Math.max(0, nextRoomIndex()) : 0]).id);
  const draw = () => {
    const r = ROOMS[roomIndex(rid)];
    const terms = [], seen = new Set();
    r.puzzles.forEach(p => (p.terms || []).forEach(t => { if (!seen.has(t[0])) { seen.add(t[0]); terms.push(t); } }));
    $journal.innerHTML = `<div class="overlay top" id="jov"><div class="modal wide" role="dialog" aria-modal="true" aria-label="${L("Study Journal", "學習日誌")}">
      <button class="iconbtn x" id="jx" aria-label="${L("Close journal", "關閉日誌")}">✕</button>
      <span class="kicker">📓 ${L("Study Journal · Chapter 14: Light, Colours and Beyond", "學習日誌 · 第 14 章：光、顏色和光譜以外")}</span>
      <h2>${topicNo(r.topicNo)}: ${topicHtml(r)}</h2>
      <div class="tabs" role="tablist">${ROOMS.map(x => `<button class="tab" role="tab" aria-selected="${x.id === rid}" data-t="${x.id}">T${x.topicNo} ${x.zh}</button>`).join("")}</div>

    `<div class="preview small"><b>這個代碼包含：</b>已逃出 ${d.escaped} 個房間${d.escaped ? `（${d.stars.filter(Boolean).map(starStr).join(" · ")}）` : ""}${d.escaped < 7 ? `，${esc(ROOMS[d.escaped].name)} 已開 ${d.lock}/5 把鎖` : ""}，🔥 連續 ${d.streak} 天，🛡️ ${d.shields} 個護盾。</div>`);

function openSaveModal() {

    <div id="codeMsg" style="display:grid;gap:10px"></div>`);
  const copy = async (text, el, ok) => {
    try { await navigator.clipboard.writeText(text); toast(ok); }
    catch (e) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(L("Selected. Press copy on your device.", "已選取，請在裝置上按複製。")); }
  };
  document.getElementById("cpCode").onclick = () => copy(code, $modal.querySelector(".codebox"), L(`Code ${code} copied 📋`, `已複製代碼 ${code} 📋`));
  document.getElementById("cpLink").onclick = () => copy(link, document.getElementById("linkbox"), L("Link copied 📋", "已複製連結 📋"));
  const go = () => {
    const d = decodeCode(document.getElementById("codeIn").value);
    const msg = document.getElementById("codeMsg");
    if (!d) { SFX.wrong(); msg.innerHTML = say("chiikawa", L("Wah... that code doesn't work. Check each letter and try again. (Codes have 5 letters or numbers.)", "哇……這個代碼不對。請逐個字母檢查再試。（代碼共有 5 個英文字母或數字。）"), "cry"); return; }

    document.getElementById("codeYes").onclick = () => applyCode(d);
    document.getElementById("codeNo").onclick = () => (msg.innerHTML = "");
  };
  document.getElementById("codeGo").onclick = go;
  document.getElementById("codeIn").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}
function clearHash() { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
function applyCode(d, name) {
  stopTimer();
  S = stateFromCode(d, name); recomputeMastery(); FORCE_SAVE = 1; save(true);
  closeModal(); SFX.item(); confetti(60);
  streakNote = L(`🔑 Progress loaded from code ${d.code}!`, `🔑 已從代碼 ${d.code} 載入進度！`);
  clearHash();
  renderMap();

}

  sideQuiz({ kicker: `🐾 ${L("Catch the wolverine!", "捉住狼獾！")}`, title: L("Answer its riddle to get your item back", "答對牠的謎題，取回你的物品"), art: "wolverine", p: sideQuestion(3),
    onRight: () => { const i = R.stolen; R.stolen = null; S.coins += 3; save(true); toast(L(`🐾 Got it back! Item #${i + 1} returned (+3 🌰)`, `🐾 取回了！物品 #${i + 1} 已歸還（+3 🌰）`)); },
    onWrong: () => { R.wolfUntil = Date.now() + 15000; R.wolfX = 20 + Math.random() * 55; toast(L("It ran off to another corner! Wait 15 s, then try again.", "牠跑到另一個角落了！15 秒後再試。")); } });
}
function owlQuiz() {
  if (!R) return;
  sideQuiz({ kicker: `🦉 ${L("Owl's bonus riddle", "貓頭鷹的獎勵謎題")}`, title: L("Hoo... can you answer this?", "咕……你答得到嗎？"), art: "owl", p: sideQuestion(6),
    onRight: () => { const run = S.room_run[R.room.id]; S.room_timer[R.room.id] += 45; S.coins += 5; const extra = heartsOf(run) < MAX_HEARTS; if (extra) run.hearts = heartsOf(run) + 1; save(true); renderRoom(); toast(L(`🦉 Wise! +45 s, +5 🌰${extra ? " and +1 ❤️" : ""}`, `🦉 聰明！+45 秒、+5 🌰${extra ? " 和 +1 ❤️" : ""}`)); },
    onWrong: () => { toast(L("🦉 Hoo... not quite. No reward this time.", "🦉 咕……不太對。這次沒有獎勵。")); } });
}

/* ============================================================
   10. Boot: save-code links (#CODE), resume prompt, or new game
   ============================================================ */
/* ============================================================
   10. Class login (Google) · cloud save · records  (ported from s1 Mochi Science Pals)
   Needs window.S3_CONFIG = {GOOGLE_CLIENT_ID, API_URL}. Empty API_URL = play on this device only.
   Server code and setup: server/Code.gs, server/SETUP.md
   ============================================================ */
const SESSION = Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
function dispName() {
  const u = AUTH.user; if (!u) return S ? S.player_name : "";
  if (u.guest) return `${u.zh || u.email.split("@")[0]} · ${L("Guest", "訪客")}`;
  return (LANG === "en" ? (u.en || u.zh) : (u.zh || u.en)) || u.email;
}
const tokenOk = () => !!AUTH.token && Date.now() < AUTH.exp - 30000;
function post(action, data) {
  return fetch(CFGX.API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ action, token: AUTH.token, app: "s3phys" }, data || {})) }).then(r => r.json());
}
function api(action, data) {
  if (AUTH.mode !== "google") return Promise.resolve({ ok: false, error: "guest" });
  if (!tokenOk()) { markStale(); return Promise.resolve({ ok: false, error: "expired" }); }
  return post(action, data).then(j => { if (!j.ok && j.error === "expired") markStale(); return j; }, () => ({ ok: false, error: "network" }));
}
function markStale() { if (!AUTH.stale) { AUTH.stale = true; renderTools(); toast(L("⚠️ Your sign-in has expired. Tap your name at the top to sign in again.", "⚠️ 登入已過期，請按頂部你的名字重新登入。")); } }
function errText(e) {
  return {
    not_listed: L("This Google account is not on the class list. Please sign in with your school account.", "此 Google 帳戶不在班級名單內。請用學校帳戶登入。"),
    bad_client: L("Sign-in is not set up correctly (client ID mismatch). Please tell your teacher.", "登入設定有誤（Client ID 不符），請通知老師。"),
    expired: L("Your sign-in has expired. Please sign in again.", "登入已過期，請重新登入。"),
    network: L("Could not reach the class server. Check your internet connection.", "無法連接班級伺服器，請檢查網絡。"),
    unverified: L("Please use a verified Google account.", "請使用已驗證的 Google 帳戶。"),
    unknown_action: L("The class server needs updating. Please ask your teacher to deploy the latest version.", "班級伺服器需要更新，請通知老師部署最新版本。")
  }[e] || L("Sign-in failed: ", "登入失敗：") + e;
}

/* ---- Google Identity Services ---- */
let gisReady = false, gisLoading = false;
function withGIS(cb) {
  if (window.google && google.accounts && google.accounts.id) {
    if (!gisReady) { google.accounts.id.initialize({ client_id: CFGX.GOOGLE_CLIENT_ID, callback: onCredential, auto_select: false, cancel_on_tap_outside: true }); gisReady = true; }
    cb(); return;
  }
  if (gisLoading) { setTimeout(() => withGIS(cb), 300); return; }
  gisLoading = true;
  const sc = document.createElement("script"); sc.src = "https://accounts.google.com/gsi/client"; sc.async = true;
  sc.onload = () => { gisLoading = false; withGIS(cb); };
  sc.onerror = () => { gisLoading = false; loginMsg(L("Could not load Google sign-in. Check your internet and try again.", "無法載入 Google 登入，請檢查網絡後再試。"), true); };
  document.head.appendChild(sc);
}
function renderGBtn(id) {
  const el = document.getElementById(id); if (!el || !cloudOn()) return;
  withGIS(() => { el.innerHTML = ""; google.accounts.id.renderButton(el, { theme: id === "gbtn" ? "filled_blue" : "outline", size: "large", shape: "pill", text: "signin_with", locale: LANG === "en" ? "en-GB" : "zh-TW", width: 260 }); });
}
function jwtPayload(t) { try { let p = t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"); while (p.length % 4) p += "="; return JSON.parse(decodeURIComponent(escape(atob(p)))); } catch (e) { return {}; } }
function loginMsg(t, bad) { const m = document.getElementById("loginMsg"); if (m) m.innerHTML = `<p style="margin:0;font-weight:700;color:${bad ? "#B4475A" : "var(--ink-soft)"}">${esc(t)}</p>`; }
function schoolGuestOk(pl) {
  const d = String(CFGX.SCHOOL_DOMAIN || "").toLowerCase().replace(/^@/, ""), em = String(pl.email || "").toLowerCase();
  return !!d && pl.email_verified !== false && em.endsWith("@" + d);
}
function onCredential(resp) {
  const tok = resp.credential, pl = jwtPayload(tok), em = String(pl.email || "").toLowerCase();
  if (AUTH.user) {   // signing in again after the token expired
    if (AUTH.mode === "google" && em === AUTH.user.email) {
      AUTH.token = tok; AUTH.exp = (pl.exp || 0) * 1000; AUTH.stale = false; closeModal();
      toast(L("☁️ Reconnected: progress synced", "☁️ 已重新連線，進度已同步")); flushQueue(); cloudSaveSoon(true); renderTools();
    } else toast(L(`Please sign in as ${AUTH.user.email}, or sign out first.`, `請以 ${AUTH.user.email} 登入，或先登出。`));
    return;
  }
  AUTH.token = tok; AUTH.exp = (pl.exp || 0) * 1000; loginMsg("⏳ " + L("Checking the class list…", "正在核對班級名單…"));
  post("login", {}).then(j => {
    if (!j.ok) { AUTH.token = null; if (j.error === "not_listed" && schoolGuestOk(pl)) { enterSchoolGuest(pl); return; } loginMsg(errText(j.error), true); return; }
    AUTH.mode = "google"; AUTH.user = j.user; AUTH.stale = false; AUTH.lastSync = Date.now();
    const local = load(); let remote = null;
    try { remote = j.progress ? normalise(JSON.parse(j.progress)) : null; } catch (e) {}
    pullSync.t = Date.now();
    startAccount(remote && (!local || progNewer(remote, local)) ? remote : local);
    flushQueue();
    toast(`👋 ${L("Hi ", "你好，")}${dispName()}${AUTH.user.cls ? ` (${AUTH.user.cls}${AUTH.user.no ? "-" + AUTH.user.no : ""})` : ""}`);
  }, () => { AUTH.token = null; loginMsg(errText("network"), true); });
}
function enterSchoolGuest(pl) {
  AUTH.mode = "guest"; AUTH.user = { email: String(pl.email || "").toLowerCase(), zh: String(pl.given_name || pl.name || ""), en: String(pl.given_name || pl.name || ""), guest: true }; AUTH.token = null; AUTH.stale = false;
  startAccount(load());
  setTimeout(() => toast(L("Guest mode: progress stays on this device. No class records.", "訪客模式：進度只儲存在此裝置，不設班級紀錄。")), 900);
}
/* after sign-in: open the account's progress; a brand-new account may bring this device's old progress with it */
function startAccount(st) {
  SFX.init(); document.body.classList.remove("lgmode");
  const linked = pendCode; pendCode = null; clearHash();
  const base = (() => { try { const raw = localStorage.getItem(SAVE_KEY) || localStorage.getItem(OLD_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } })();
  S = st || freshState(); checkIn(); save(true);
  if (st) { renderMap(); linked ? showCodeFromLink(linked) : showResume(); return; }
  streakPop = null; renderMap("home");
  if (linked) { showCodeFromLink(linked); return; }
  if (!base || base.imported || !(base.completed_rooms || []).length && !(base.coins > 0)) { modeChooser(); return; }
  openModal(`<span class="kicker">${IC("user")} ${L("Your account", "你的帳戶")}</span><h2>${L("Bring your old progress?", "要帶入舊進度嗎？")}</h2>
    ${say("hachiware", L(`This device has progress from before you signed in (${(base.completed_rooms || []).length} room(s) escaped, ${base.coins || 0} 🌰). Move it into your account? Only do this if it is yours.`, `此裝置有登入前的進度（已逃出 ${(base.completed_rooms || []).length} 個房間、${base.coins || 0} 🌰）。要搬入你的帳戶嗎？只有是你自己的進度才可以這樣做。`), "normal", "hint")}
    <div class="row"><button class="btn big" id="imYes">${L("Yes, it's mine", "是我的")}</button><button class="btn plain" id="imNo">${L("No, start fresh", "不是，重新開始")}</button></div>`, { closable: false });
  const done = moved => { base.imported = 1; try { localStorage.setItem(SAVE_KEY, JSON.stringify(base)); } catch (e) {} closeModal(); renderMap("home"); if (!moved) modeChooser(); };
  document.getElementById("imYes").onclick = () => { SFX.item(); S = normalise(base); delete S.imported; checkIn(); FORCE_SAVE = 1; save(true); cloudSaveSoon(true); done(true); toast(L("Progress moved into your account ✓", "進度已搬入你的帳戶 ✓")); };
  document.getElementById("imNo").onclick = () => { SFX.tap(); done(false); };
}
function signOut() {
  if (AUTH.mode === "google" && S) { clearTimeout(cloudTimer); cloudSave(); }
  if (S) save();
  try { if (window.google && google.accounts) google.accounts.id.disableAutoSelect(); } catch (e) {}
  stopPractice(); stopStudy();
  AUTH = { mode: null, user: null, token: null, exp: 0, stale: false, lastSync: 0 };
  S = null; closeModal(); renderWelcome();
}

/* ---- records queue (kept on the device until the server has them) ---- */
const qKey = () => SAVE_KEY + "_queue_" + (AUTH.user ? AUTH.user.email : "");
function getQ() { try { return JSON.parse(localStorage.getItem(qKey()) || "[]"); } catch (e) { return []; } }
function setQ(a) { try { localStorage.setItem(qKey(), JSON.stringify(a.slice(-300))); } catch (e) {} }
function logRec(r) {
  if (AUTH.mode !== "google") return;
  Object.assign(r, { session: SESSION, lang: LANG === "zh" ? "中文" : "English", end: new Date().toISOString() });
  const a = getQ(); a.push(r); setQ(a); flushQueue();
}
let flushing = false;
function flushQueue() {
  if (flushing || AUTH.mode !== "google") return;
  const a = getQ(); if (!a.length) return;
  flushing = true;
  api("record", { records: a }).then(j => { flushing = false; if (j.ok) { setQ(getQ().slice(a.length)); AUTH.lastSync = Date.now(); } });
}

/* ---- cloud save: an older copy (e.g. a tab left open on another device) never overwrites newer progress ---- */
var cloudTimer = null, FORCE_SAVE = 0;
function cloudSaveSoon(now) { if (AUTH.mode !== "google") return; clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudSave, now ? 50 : 6000); }
function cloudPayload() {
  let st = JSON.stringify(S);
  if (st.length > 45000) { const c = JSON.parse(st); c.seen = {}; st = JSON.stringify(c); }
  return { state: st, summary: { streak: S.current_streak, best: S.longest_streak, stars: ROOMS.reduce((n, r) => n + roomStars(r), 0), rooms: S.completed_rooms.length, coins: S.coins, mistakes: mistakeCount(), trophies: Object.keys(S.trophies || {}).length, days: S.stats.days, lastDay: S.last_login_date || "", score: dedication() } };
}
function cloudSave() {
  if (AUTH.mode !== "google" || !S) return;
  if (!tokenOk()) { markStale(); return; }
  const pl = cloudPayload(); if (FORCE_SAVE) pl.force = 1;
  api("save", pl).then(j => { if (j.ok) { AUTH.lastSync = Date.now(); FORCE_SAVE = 0; } else if (j.error === "stale" && j.progress) adoptRemote(j.progress); });
}
const progRank = x => x ? [x.last_login_date ? dayNum(x.last_login_date) : 0, (x.stats && x.stats.days) || 0, (x.stats && x.stats.correct) || 0] : [-1, 0, 0];
function progNewer(a, b) { const A = progRank(a), B = progRank(b); for (let i = 0; i < A.length; i++) if (A[i] !== B[i]) return A[i] > B[i]; return false; }
function adoptRemote(raw) {
  let r = null; try { r = normalise(typeof raw === "string" ? JSON.parse(raw) : raw); } catch (e) {}
  if (!r) return false;
  if (R || document.getElementById("ov") || PR || ST || RU) { pullSync.t = 0; return false; }   // never swap progress mid-activity
  S = r; try { localStorage.setItem(storeKey(), JSON.stringify(S)); } catch (e) {}
  renderMap(); toast(L("☁️ Loaded your newer progress from another device", "☁️ 已載入你在另一部裝置的較新進度")); return true;
}
/* when the game comes back to the front, fetch the cloud copy first, so an old tab never plays on stale data */
function pullSync() {
  if (AUTH.mode !== "google" || !tokenOk() || pullSync.busy || Date.now() - (pullSync.t || 0) < 45000) return;
  pullSync.busy = 1; pullSync.t = Date.now();
  post("login", {}).then(j => {
    pullSync.busy = 0; if (!j || !j.ok || !j.progress) return;
    try { const r = JSON.parse(j.progress); if (progNewer(r, S)) adoptRemote(r); } catch (e) {}
  }, () => { pullSync.busy = 0; });
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) pullSync(); });
window.addEventListener("focus", () => pullSync());
window.addEventListener("pagehide", () => {
  if (AUTH.mode !== "google" || !S || !tokenOk() || !navigator.sendBeacon) return;
  try {
    navigator.sendBeacon(CFGX.API_URL, JSON.stringify(Object.assign({ action: "save", token: AUTH.token }, cloudPayload())));
    const a = getQ(); if (a.length) navigator.sendBeacon(CFGX.API_URL, JSON.stringify({ action: "record", token: AUTH.token, records: a }));
  } catch (e) {}
});

/* ---- account sheet (tap your name in the top bar) ---- */
function openAccount() {
  const u = AUTH.user; if (!u) return;
  const q = getQ().length;
  const info = u.guest
    ? `<div class="preview" style="display:grid;gap:4px"><b style="font-size:1.1rem">${esc(u.zh || "")}</b><span class="small muted">${esc(u.email)}</span><span class="small">${IC("user")} ${L("<b>Guest mode</b>: progress is saved on this device only. No class records.", "<b>訪客模式</b>：進度只儲存在此裝置，不設班級紀錄。")}</span></div>`
    : `<div class="preview" style="display:grid;gap:4px"><b style="font-size:1.1rem">${esc(u.zh || "")} ${esc(u.en || "")}</b><span class="small muted">${u.cls ? esc(u.cls) + (u.no ? ` · ${L("No. ", "班號 ")}${esc(u.no)}` : "") : ""}${u.teacher ? ` · ${L("Teacher", "老師")}` : ""}</span><span class="small muted">${esc(u.email)}</span>
      <span class="small">${AUTH.stale ? "⚠️ " + L("Sign-in expired. Sign in again to keep syncing (progress is still saved on this device).", "登入已過期，請重新登入以繼續同步（進度仍會儲存在此裝置）。") : `${IC("cloud")} ${L("Synced", "已同步")} ${AUTH.lastSync ? new Date(AUTH.lastSync).toLocaleTimeString() : ""}${q ? ` · ${q} ${L("record(s) waiting", "條記錄待上傳")}` : ""}`}</span></div>`;
  openModal(`<span class="kicker">${IC("user")} ${L("Account", "帳戶")}</span><h2>${esc(dispName())}</h2>${info}
    ${AUTH.mode === "google" ? (AUTH.stale ? `<div id="gbtn2" style="display:flex;justify-content:center;min-height:44px"></div>` : `<div class="row"><button class="btn blue" id="aSync">${IC("cloud")} ${L("Sync now", "立即同步")}</button></div>`) : ""}
    <div class="row"><button class="btn plain" id="aOut">🚪 ${L("Sign out", "登出")}</button></div>`);
  if (document.getElementById("gbtn2")) renderGBtn("gbtn2");
  const sy = document.getElementById("aSync"); if (sy) sy.onclick = () => { SFX.tap(); cloudSaveSoon(true); flushQueue(); toast(L("☁️ Syncing…", "☁️ 同步中…")); };
  document.getElementById("aOut").onclick = () => { SFX.tap(); signOut(); };
}

document.getElementById("home").onclick = () => { if (S) { SFX.init(); SFX.tap(); closeModal(); renderMap(); } };
document.addEventListener("pointerdown", () => { SFX.init(); MUSIC.start(); }, { once: true });
document.addEventListener("keydown", () => { SFX.init(); MUSIC.start(); }, { once: true });
document.addEventListener("visibilitychange", () => { if (document.hidden && S) save(); });
window.addEventListener("pagehide", () => { if (S) save(); });
(function boot() {
  const linked = decodeCode(location.hash.slice(1));
  if (cloudOn()) { pendCode = linked; renderWelcome(); return; }
  if (linked) { S ? renderMap() : renderWelcome(); showCodeFromLink(linked); return; }
  if (S) { checkIn(); renderMap(); showResume(); } else renderWelcome();
})();
</script>
