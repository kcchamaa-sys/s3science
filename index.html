<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2433">
<title>Chiikawa Physics Escape</title>
<meta name="description" content="A Chiikawa-style escape room game for HK S3 Science: Light.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Noto+Sans+HK:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Single deliberate look: Chiikawa picture-book cream + dim escape-room scenes. */
:root {
  color-scheme: light;
  --cream: #FFFDF0;
  --cream-2: #FFF6DA;
  --ink: #4A3E3D;
  --ink-soft: #7A6A66;
  --pink: #FFB7C5;
  --pink-2: #FFD6DF;
  --blue: #A0C4FF;
  --blue-2: #D3E4FF;
  --yellow: #FDFFB6;
  --green: #B9F3C9;
  --red: #FFADAD;
  --night: #2B2433;
  --led: #FF6B6B;
  --shadow: 4px 4px 0 var(--ink);
  --shadow-sm: 3px 3px 0 var(--ink);
  --line: 3px solid var(--ink);
  --r: 18px;
  --font: "M PLUS Rounded 1c", "Noto Sans HK", system-ui, sans-serif;
  --zh: "Noto Sans HK", "PingFang HK", "Microsoft JhengHei", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--cream); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance; font-weight: 800; }
p { margin: 0; }
.zh { font-family: var(--zh); font-weight: 500; }
.muted { color: var(--ink-soft); }
.small { font-size: .86rem; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

/* ---------- Buttons ---------- */
.btn {
  background: var(--pink); border: var(--line); border-radius: 16px; box-shadow: var(--shadow);
  padding: 10px 18px; font-weight: 800; min-height: 48px; transition: transform .08s, box-shadow .08s;
}
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn.blue { background: var(--blue); }
.btn.yellow { background: var(--yellow); }
.btn.plain { background: var(--cream); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.big { font-size: 1.1rem; padding: 12px 24px; }
.iconbtn {
  background: var(--cream); border: var(--line); border-radius: 14px; box-shadow: var(--shadow-sm);
  min-width: 44px; min-height: 44px; padding: 4px 10px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.iconbtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- Top bar ---------- */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  background: var(--cream); border-bottom: var(--line);
}
.brand { background: none; border: 0; padding: 0; font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 34px; height: 34px; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { border: var(--line); border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: .88rem; background: var(--yellow); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.saved { background: var(--green); animation: pop .4s ease-out; }
@media (max-width: 560px) { .tools .lbl { display: none; } .brand .bt { display: none; } .tools { gap: 6px; } .iconbtn { min-width: 42px; padding: 4px 8px; } }

main { max-width: 1000px; margin: 0 auto; padding: 16px 16px 40px; display: grid; gap: 16px; }
.card { background: #fff; border: var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.card.cream { background: var(--cream-2); }

/* ---------- Speech ---------- */
.say { display: flex; gap: 12px; align-items: flex-start; }
.say .av { flex: 0 0 56px; width: 56px; height: 56px; animation: bob 2.4s ease-in-out infinite; }
.say .av svg { width: 100%; height: 100%; overflow: visible; }
.bubble { position: relative; background: #fff; border: var(--line); border-radius: 18px; padding: 8px 14px; box-shadow: var(--shadow-sm); min-width: 0; }
.bubble::before { content: ""; position: absolute; left: -11px; top: 16px; border: 9px solid transparent; border-right-color: var(--ink); border-left: 0; }
.bubble::after { content: ""; position: absolute; left: -6px; top: 18px; border: 7px solid transparent; border-right-color: #fff; border-left: 0; }
.bubble .name { display: block; font-size: .78rem; font-weight: 800; color: var(--ink-soft); }
.bubble.hint { background: var(--blue-2); }
.bubble.hint::after { border-right-color: var(--blue-2); }

/* ---------- Title / map ---------- */
.hero { background: var(--night); color: #fff; border: var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 22px 18px 0; overflow: hidden; position: relative; display: grid; gap: 8px; }
.hero h1 { font-size: clamp(1.7rem, 5.5vw, 2.6rem); position: relative; }
.hero .sub { color: var(--yellow); font-weight: 700; position: relative; }
.hero .stars { position: absolute; inset: 0; pointer-events: none; }
.hero .stars span { position: absolute; color: var(--yellow); animation: twinkle 2.6s ease-in-out infinite; }
.cast { display: flex; justify-content: center; align-items: flex-end; margin-top: 6px; position: relative; }
.cast .fig { width: clamp(64px, 16vw, 120px); margin: 0 -4px; animation: bob 2.6s ease-in-out infinite; }
.cast .fig:nth-child(2) { animation-delay: -.6s; } .cast .fig:nth-child(3) { animation-delay: -1.2s; width: clamp(76px, 19vw, 140px); }
.cast .fig:nth-child(4) { animation-delay: -1.8s; } .cast .fig:nth-child(5) { animation-delay: -2.2s; }
.cast .fig svg { width: 100%; height: auto; display: block; overflow: visible; }
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.topic {
  text-align: left; background: #fff; border: var(--line); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 14px; display: grid; gap: 6px; align-content: start; transition: transform .12s, box-shadow .12s;
}
.topic:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
.topic.next { background: var(--yellow); }
.topic.done { background: var(--green); }
.topic:disabled { opacity: .55; cursor: not-allowed; }
.topic .tnum { font-size: .8rem; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; }
.topic .tname { font-weight: 800; font-size: 1.05rem; }
.topic .rstars { font-size: 1.1rem; letter-spacing: 2px; }
.bag { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { border: 2px solid var(--ink); border-radius: 999px; padding: 2px 10px; font-size: .85rem; font-weight: 700; background: var(--cream); display: inline-flex; align-items: center; gap: 4px; }

/* ---------- Room view ---------- */
.roomhead {
  background: var(--night); color: #fff; border: var(--line); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 10px 14px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center;
  background-image: radial-gradient(circle at 12% 0%, rgba(255,107,107,.35), transparent 45%), radial-gradient(circle at 90% 100%, rgba(160,196,255,.25), transparent 50%);
}
.roomhead .rt { font-weight: 800; font-size: 1.05rem; }
.roomhead .rtopic { font-size: .85rem; color: var(--yellow); }
.timer {
  font-variant-numeric: tabular-nums; font-weight: 800; font-size: clamp(1.4rem, 5vw, 2rem); letter-spacing: .06em;
  background: #120e17; color: var(--led); border: 3px solid #000; border-radius: 12px; padding: 2px 12px;
  text-shadow: 0 0 8px rgba(255,107,107,.9), 0 0 18px rgba(255,107,107,.5); box-shadow: inset 0 0 12px rgba(255,107,107,.25);
}
.timer.low { animation: blink 1s steps(2, start) infinite; }
.timer.over { color: var(--yellow); font-size: clamp(1rem, 3.6vw, 1.4rem); text-shadow: 0 0 8px rgba(253,255,182,.8); }
.status { display: flex; gap: 10px; align-items: center; min-width: 0; }
.status .av { width: 64px; height: 64px; flex: 0 0 64px; }
.status .av svg { width: 100%; height: 100%; overflow: visible; }
.scene-wrap { border: var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; background: var(--night); }
.scene { position: relative; width: 100%; aspect-ratio: 8 / 5; max-width: 100%; }
.scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scene .obj { cursor: pointer; }
.scene .obj:hover { filter: brightness(1.12); }
.dark {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(circle at var(--sx, 50%) var(--sy, 45%), rgba(20,14,28,0) 0, rgba(20,14,28,0) 16%, rgba(20,14,28,var(--dim, .5)) 46%);
}
.hs {
  position: absolute; transform: translate(-50%, -50%); width: 46px; height: 46px; border-radius: 50%;
  border: var(--line); background: var(--yellow); box-shadow: var(--shadow-sm); font-weight: 800; font-size: 1.2rem;
  display: grid; place-items: center; animation: glow 1.8s ease-in-out infinite; padding: 0;
}
.hs.done { background: var(--green); animation: none; }
.hs.door { background: var(--pink); }
.hs .lbl { position: absolute; top: 100%; margin-top: 4px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: .72rem; background: var(--cream); border: 2px solid var(--ink); border-radius: 8px; padding: 0 6px; }
@media (max-width: 560px) { .hs { width: 38px; height: 38px; font-size: 1rem; } .hs .lbl { display: none; } }
.inv { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.slot {
  border: 3px dashed var(--ink-soft); border-radius: 14px; min-height: 80px; display: grid; place-items: center; align-content: center; gap: 2px; text-align: center;
  padding: 6px 4px; font-size: .74rem; font-weight: 700; background: var(--cream); line-height: 1.2; min-width: 0;
}
.slot.full { border-style: solid; border-color: var(--ink); background: #fff; box-shadow: var(--shadow-sm); }
.slot.new { animation: pop .5s ease-out; }
.slot svg { width: 30px; height: 30px; }
.slot .code { display: inline-block; background: var(--yellow); border: 2px solid var(--ink); border-radius: 6px; padding: 0 5px; font-size: .8rem; font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { .slot .nm { display: none; } }

/* ---------- Modals ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(43,36,51,.6); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.overlay.top { z-index: 60; }
.modal {
  background: var(--cream); border: var(--line); border-radius: 22px; box-shadow: 6px 6px 0 var(--ink);
  width: min(640px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; padding: 18px; display: grid; gap: 12px;
  animation: pop .25s ease-out; position: relative;
}
.modal.wide { width: min(760px, 100%); }
.modal .x { position: absolute; top: 10px; right: 10px; }
.modal h2 { padding-right: 52px; }
.kicker { font-size: .78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); padding-right: 52px; }
.q { font-weight: 800; font-size: 1.06rem; }
.choices { display: grid; gap: 10px; }
@media (min-width: 640px) { .choices { grid-template-columns: 1fr 1fr; } }
.choice { text-align: left; background: #fff; border: var(--line); border-radius: 14px; box-shadow: var(--shadow-sm); padding: 10px 12px; min-height: 48px; display: flex; gap: 8px; }
.choice b { flex: 0 0 auto; }
.choice.right { background: var(--green); }
.choice.wrong { background: var(--red); }
.choice:disabled { cursor: default; }
.keypad { display: grid; gap: 10px; justify-items: center; }
.kdisplay {
  width: min(280px, 100%); background: #120e17; color: var(--led); border: 3px solid #000; border-radius: 12px; padding: 6px 12px;
  font-size: 1.7rem; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; min-height: 56px; letter-spacing: .08em;
  text-shadow: 0 0 8px rgba(255,107,107,.8);
}
.kdisplay .u { color: var(--yellow); font-size: .9rem; margin-left: 6px; text-shadow: none; letter-spacing: 0; }
.keys { display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; }
.key { height: 54px; border: var(--line); border-radius: 12px; background: #fff; box-shadow: var(--shadow-sm); font-weight: 800; font-size: 1.2rem; }
.key:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.key.del { background: var(--pink-2); }
.dials { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.dial { display: grid; gap: 6px; justify-items: center; }
.dial .dlabel { font-size: .8rem; font-weight: 800; background: var(--yellow); border: 2px solid var(--ink); border-radius: 8px; padding: 0 8px; text-align: center; }
.dial .face { min-width: 128px; background: #fff; border: var(--line); border-radius: 14px; box-shadow: inset 0 -6px 0 var(--cream-2); padding: 12px 10px; font-weight: 800; text-align: center; font-size: 1.05rem; }
@media (max-width: 560px) { .dials { flex-direction: column; align-items: stretch; } .dial { grid-template-columns: 48px 1fr 48px; align-items: center; } .dial .dlabel { grid-column: 1 / -1; justify-self: center; } .dial .face { min-width: 0; padding: 8px 6px; } .dial .arr { width: 48px; } }
.dial .face.spin { animation: spin .25s ease-out; }
.dial .arr { width: 56px; height: 38px; border: var(--line); border-radius: 10px; background: var(--blue); box-shadow: var(--shadow-sm); font-weight: 800; }
.fb { border: var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 10px; }
.fb.ok { background: #EFFFF3; } .fb.no { background: #FFF0F0; }
.terms { display: flex; flex-wrap: wrap; gap: 6px; }
.term { border: 2px solid var(--ink); border-radius: 10px; padding: 2px 8px; font-size: .88rem; background: #fff; }
.term .zh { margin-left: 5px; color: #A23E60; }
.tip { border: 2px dashed var(--ink); background: var(--yellow); border-radius: 12px; padding: 8px 12px; font-size: .92rem; }
.diagram-box { overflow-x: auto; background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 6px; }
.diagram { display: block; width: 100%; max-width: 440px; height: auto; margin: 0 auto; }
.modal.shake { animation: shake .45s ease-in-out; }
.found { background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; }
.found svg { width: 32px; height: 32px; flex: 0 0 32px; }

/* Journal */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.tab { flex: 0 0 auto; border: 2px solid var(--ink); border-radius: 999px; background: #fff; padding: 4px 12px; font-weight: 800; font-size: .86rem; }
.tab[aria-selected="true"] { background: var(--pink); }
.jsec { display: grid; gap: 6px; }
.jsec h3 { font-size: 1rem; }
.jsec ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.formula { font-weight: 800; background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 6px 10px; font-variant-numeric: tabular-nums; }
.tterms { width: 100%; border-collapse: collapse; font-size: .92rem; }
.tterms td { border-bottom: 1px solid #E5DCC9; padding: 4px 6px; }
.tterms tr.hl td { background: var(--yellow); font-weight: 800; }

/* Save code */
.codebox { display: flex; gap: 8px; justify-content: center; }
.codebox span { width: 52px; height: 64px; display: grid; place-items: center; border: var(--line); border-radius: 12px; background: #fff; box-shadow: var(--shadow-sm); font-size: 1.9rem; font-weight: 800; }
.codein { font: inherit; font-size: 1.5rem; font-weight: 800; letter-spacing: .3em; text-transform: uppercase; text-align: center; width: 220px; max-width: 100%; border: var(--line); border-radius: 14px; padding: 8px; background: #fff; color: var(--ink); }
.linkbox { font-size: .82rem; word-break: break-all; background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 6px 10px; user-select: all; }
input.name { font: inherit; font-size: 16px; border: var(--line); border-radius: 14px; padding: 10px 12px; width: 100%; max-width: 320px; background: #fff; color: var(--ink); min-height: 48px; }
.preview { background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 8px 12px; }

/* Celebration */
.yaha { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; pointer-events: none; }
.yaha .inner { display: grid; justify-items: center; animation: jump 1.2s ease-out forwards; }
.yaha .inner svg { width: 140px; height: auto; overflow: visible; }
.yaha .word { font-size: 3rem; font-weight: 800; color: var(--ink); background: var(--yellow); border: var(--line); border-radius: 20px; padding: 0 18px; box-shadow: var(--shadow); transform: rotate(-6deg); }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 80; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90; background: var(--ink); color: var(--cream); padding: 10px 16px; border-radius: 14px; font-weight: 700; max-width: calc(100% - 32px); }
footer { text-align: center; font-size: .78rem; color: var(--ink-soft); padding: 0 16px 24px; }

.door-panel { transform-box: fill-box; transform-origin: left center; transition: transform .9s ease-in; }
.door-open .door-panel { transform: scaleX(.12); }
.door-light { opacity: 0; transition: opacity .9s; }
.door-open .door-light { opacity: 1; }

/* Trophy cabinet */
.cabinet { background: linear-gradient(#FFF6DA, #FFF6DA) padding-box; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.trophy {
  background: #fff; border: var(--line); border-radius: 18px; box-shadow: var(--shadow-sm); padding: 10px 10px 12px;
  display: grid; gap: 4px; justify-items: center; text-align: center; position: relative; align-content: start;
}
.trophy::after { content: ""; position: absolute; left: 10px; right: 10px; top: 118px; height: 8px; background: #C98F6B; border: 2px solid var(--ink); border-radius: 4px; }
.trophy svg.cup { width: 96px; height: 116px; overflow: visible; }
.trophy.got svg.cup { animation: shine 3s ease-in-out infinite; }
.trophy .tn { font-weight: 800; margin-top: 10px; line-height: 1.2; }
.trophy .rar { font-size: .7rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; border: 2px solid var(--ink); border-radius: 999px; padding: 0 8px; }
.rar.bronze { background: #F2C9A0; } .rar.silver { background: #E3E8F0; } .rar.gold { background: #FFE27A; }
.rar.legend { background: linear-gradient(90deg, #FFB7C5, #FDFFB6, #B9F3C9, #A0C4FF, #C9C3F0); }
.trophy .td { font-size: .8rem; color: var(--ink-soft); line-height: 1.3; }
.trophy .pbar { width: 100%; height: 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--cream); overflow: hidden; }
.trophy .pbar i { display: block; height: 100%; background: var(--pink); }
.trophy .pnum { font-size: .78rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.trophy.locked { background: #F4F0E8; }
.trophy.locked .tn { color: var(--ink-soft); }
.tbanner {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 95;
  background: var(--yellow); border: var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 10px 16px;
  display: flex; gap: 12px; align-items: center; width: min(420px, calc(100% - 32px)); animation: drop .5s ease-out;
}
.tbanner svg { width: 56px; height: 68px; flex: 0 0 56px; overflow: visible; }
/* Anti-guessing */
.jam { border: var(--line); border-radius: 16px; background: #2B2433; color: #fff; padding: 12px; display: grid; gap: 6px; text-align: center; }
.jam .jt { color: var(--led); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; text-shadow: 0 0 8px rgba(255,107,107,.8); }
#ans.jammed { opacity: .35; filter: grayscale(1); }
.strikes { font-weight: 800; font-size: .85rem; background: rgba(255,107,107,.2); border: 2px solid var(--led); border-radius: 999px; padding: 0 8px; }
.penalty { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); z-index: 96; pointer-events: none; font-size: 2.4rem; font-weight: 800; color: #fff; background: #D64545; border: var(--line); border-radius: 18px; padding: 0 16px; box-shadow: var(--shadow); animation: rise 1.1s ease-out forwards; }
.rules { background: #FFF0F0; border: 2px dashed var(--ink); border-radius: 12px; padding: 8px 12px; font-size: .9rem; }
.rules ul { margin: 4px 0 0; padding-left: 20px; }
@keyframes shine { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-3deg) translateY(-2px); } }
@keyframes drop { 0% { transform: translate(-50%, -120%); } 70% { transform: translate(-50%, 6px); } 100% { transform: translate(-50%, 0); } }
@keyframes rise { 0% { transform: translate(-50%, 20px) scale(.7); opacity: 0; } 20% { transform: translate(-50%, 0) scale(1.1); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(-50%, -40px); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes pop { 0% { transform: scale(.88); } 70% { transform: scale(1.04); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }

<script>
/* ============================================================
   1. Characters: original Chiikawa-style SVG drawings
   mood: "normal" | "happy" | "cry"
   ============================================================ */
const INK = "#4A3E3D";
let clipN = 0;
function eyes(x1, x2, y, mood, big) {
  if (mood === "happy") return `<path d="M${x1 - 3.2} ${y + 1.2} q3.2 -4.4 6.4 0 M${x2 - 3.2} ${y + 1.2} q3.2 -4.4 6.4 0" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/>`;
  const rx = big ? 3.8 : 2.7, ry = big ? 4.4 : 3.3, hr = big ? 1.4 : 1;
  let s = `<ellipse cx="${x1}" cy="${y}" rx="${rx}" ry="${ry}" fill="${INK}"/><ellipse cx="${x2}" cy="${y}" rx="${rx}" ry="${ry}" fill="${INK}"/>
    <circle cx="${x1 + 1}" cy="${y - 1.3}" r="${hr}" fill="#fff"/><circle cx="${x2 + 1}" cy="${y - 1.3}" r="${hr}" fill="#fff"/>`;
  if (mood === "cry") s += `<path d="M${x1} ${y + 4} q-2.4 4.5 0 6.5 q2.4 -2 0 -6.5Z M${x2} ${y + 4} q-2.4 4.5 0 6.5 q2.4 -2 0 -6.5Z" fill="#A0C4FF" stroke="#5B8FC9" stroke-width=".8"/>`;
  return s;
}
function blush(x1, x2, y) {
  const h = x => `M${x - 3.5} ${y + 1.6} l1.6 -3.2 M${x - .5} ${y + 1.6} l1.6 -3.2 M${x + 2.5} ${y + 1.6} l1.6 -3.2`;
  return `<ellipse cx="${x1}" cy="${y}" rx="5.2" ry="3.2" fill="#FFB7C5"/><ellipse cx="${x2}" cy="${y}" rx="5.2" ry="3.2" fill="#FFB7C5"/>
    <path d="${h(x1)} ${h(x2)}" stroke="#E27893" stroke-width=".9" stroke-linecap="round"/>`;
}
function mouth(x, y, mood, open) {
  if (mood === "cry") return `<path d="M${x - 4.5} ${y + 1.5} q2.25 -2.5 4.5 0 q2.25 2.5 4.5 0" fill="none" stroke="${INK}" stroke-width="1.8" stroke-linecap="round"/>`;
  if (open || mood === "happy") return `<path d="M${x - 3.8} ${y - 1} q3.8 6 7.6 0 Z" fill="#F07C9A" stroke="${INK}" stroke-width="1.6" stroke-linejoin="round"/>`;
  return `<path d="M${x - 2.6} ${y} q1.3 1.8 2.6 0 q1.3 1.8 2.6 0" fill="none" stroke="${INK}" stroke-width="1.6" stroke-linecap="round"/>`;
}
const OUT = `stroke="${INK}" stroke-width="2.4" stroke-linejoin="round"`;
const CHAR = {
  chiikawa: { name: "Chiikawa", color: "#ffffff",
    head: m => `<circle cx="17" cy="17" r="7" fill="#fff" ${OUT}/><circle cx="47" cy="17" r="7" fill="#fff" ${OUT}/>
      <ellipse cx="32" cy="37" rx="25" ry="21" fill="#fff" ${OUT}/>${blush(15, 49, 43)}${eyes(24, 40, 36, m)}${mouth(32, 43, m)}` },
  hachiware: { name: "Hachiware", color: "#ffffff",
    head: m => { const id = "hc" + (++clipN); return `<path d="M9 26 L13 5 L26 16Z" fill="#A0C4FF" ${OUT}/><path d="M55 26 L51 5 L38 16Z" fill="#A0C4FF" ${OUT}/>
      <clipPath id="${id}"><ellipse cx="32" cy="37" rx="25" ry="21"/></clipPath>
      <ellipse cx="32" cy="37" rx="25" ry="21" fill="#fff"/>
      <path clip-path="url(#${id})" d="M0 33 L0 0 L64 0 L64 33 L42 33 L32 17 L22 33 Z" fill="#A0C4FF"/>
      <ellipse cx="32" cy="37" rx="25" ry="21" fill="none" ${OUT}/>${blush(15, 49, 44)}${eyes(24, 40, 38, m)}${mouth(32, 45, m)}`; } },
  usagi: { name: "Usagi", color: "#FDF3A8",
    head: m => `<ellipse cx="23" cy="10" rx="5.5" ry="13" fill="#FDF3A8" ${OUT}/><ellipse cx="41" cy="10" rx="5.5" ry="13" fill="#FDF3A8" ${OUT}/>
      <ellipse cx="23" cy="10" rx="2" ry="8" fill="#FFB7C5"/><ellipse cx="41" cy="10" rx="2" ry="8" fill="#FFB7C5"/>
      <ellipse cx="32" cy="38" rx="24" ry="20" fill="#FDF3A8" ${OUT}/>${blush(15, 49, 44)}${eyes(24, 40, 37, m)}${mouth(32, 45, m, true)}` },
  momonga: { name: "Momonga", color: "#ffffff",
    head: m => { const id = "mc" + (++clipN); return `<circle cx="14" cy="21" r="6.5" fill="#C9C3F0" ${OUT}/><circle cx="50" cy="21" r="6.5" fill="#C9C3F0" ${OUT}/>
      <clipPath id="${id}"><ellipse cx="32" cy="37" rx="25" ry="21"/></clipPath>
      <ellipse cx="32" cy="37" rx="25" ry="21" fill="#fff"/>
      <path clip-path="url(#${id})" d="M0 30 Q32 15 64 30 L64 0 L0 0 Z" fill="#C9C3F0"/>
      <ellipse cx="32" cy="37" rx="25" ry="21" fill="none" ${OUT}/>${blush(14, 50, 45)}${eyes(23, 41, 38, m, true)}${mouth(32, 46, m)}`; } },
  kurimanju: { name: "Kuri-Manju", color: "#F2D7AE",
    head: m => { const id = "kc" + (++clipN);
      const e = m === "normal" ? `<path d="M21 37 h6 M37 37 h6" stroke="${INK}" stroke-width="2.2" stroke-linecap="round"/>` : eyes(24, 40, 37, m);
      return `<clipPath id="${id}"><path d="M8 45 Q6 18 32 16 Q58 18 56 45 Q32 56 8 45Z"/></clipPath>
      <path d="M8 45 Q6 18 32 16 Q58 18 56 45 Q32 56 8 45Z" fill="#F2D7AE"/>
      <path clip-path="url(#${id})" d="M0 29 Q32 19 64 29 L64 0 L0 0 Z" fill="#A8703F"/>
      <path d="M8 45 Q6 18 32 16 Q58 18 56 45 Q32 56 8 45Z" fill="none" ${OUT}/>${blush(15, 49, 43)}${e}${mouth(32, 44, m)}`; } }
};
const avatar = (who, mood = "normal") => `<svg viewBox="0 0 64 64" aria-hidden="true"><g filter="url(#sketch)">${CHAR[who].head(mood)}</g></svg>`;
function figure(who, mood = "normal") {
  const c = CHAR[who].color;
  return `<svg viewBox="-4 -4 72 100" aria-hidden="true"><g filter="url(#sketch)">
    <ellipse cx="32" cy="76" rx="19" ry="15" fill="${c}" ${OUT}/>
    <ellipse cx="13" cy="70" rx="5" ry="7" fill="${c}" ${OUT} transform="rotate(30 13 70)"/>
    <ellipse cx="51" cy="70" rx="5" ry="7" fill="${c}" ${OUT} transform="rotate(-30 51 70)"/>
    <ellipse cx="24" cy="90" rx="6" ry="3.5" fill="${c}" ${OUT}/><ellipse cx="40" cy="90" rx="6" ry="3.5" fill="${c}" ${OUT}/>
    ${CHAR[who].head(mood)}</g></svg>`;
}

/* ============================================================
   2. Sound effects: Web Audio, no files
   ============================================================ */
const SFX = {
  ctx: null, on: true,
  init() {
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === "suspended") this.ctx.resume();
    } catch (e) { this.ctx = null; }
  },
  tone(freq, dur, { type = "sine", vol = .15, at = 0, to = null } = {}) {
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime + at, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + dur + .02);
  },
  tap() { this.tone(660, .06, { type: "triangle", vol: .07 }); },
  beep() { this.tone(1320, .05, { type: "square", vol: .04 }); },
  click() { this.tone(900, .03, { type: "square", vol: .05 }); this.tone(500, .04, { type: "triangle", vol: .06, at: .03 }); },
  right() { [784, 988, 1319].forEach((f, i) => this.tone(f, .2, { type: "triangle", at: i * .08, vol: .13 })); },
  yaha() { this.tone(1500, .1, { vol: .12, to: 1900 }); this.tone(1900, .18, { vol: .12, at: .13, to: 1300 }); },
  wrong() { this.tone(330, .16, { type: "square", vol: .05, to: 220 }); this.tone(247, .28, { type: "triangle", vol: .1, at: .13, to: 165 }); },
  item() { [1046, 1568, 2093].forEach((f, i) => this.tone(f, .16, { at: i * .06, vol: .08 })); },
  hint() { this.tone(1046, .3, { vol: .09 }); this.tone(1568, .4, { vol: .05, at: .08 }); },
  door() { this.tone(110, .9, { type: "sawtooth", vol: .05, to: 70 }); this.tone(180, .7, { type: "triangle", vol: .06, at: .2, to: 120 }); },
  tick() { this.tone(1800, .02, { type: "square", vol: .03 }); },
  fanfare() {
    [[523, 0], [659, .12], [784, .24], [1046, .36], [784, .52], [1046, .64]].forEach(([f, a]) => this.tone(f, .26, { type: "triangle", at: a, vol: .13 }));
    this.tone(1319, .8, { at: .8, vol: .11 });
  }
};

/* ============================================================
   2b. Background music: soft, generated live (no audio files).
   Map: gentle music-box tune in C major. Rooms: slower, mysterious A-minor tune.
   ============================================================ */
const MUSIC_KEY = "escapeGameMusic";
const SONGS = {
  map: { bpm: 84,
    chords: [[48, 52, 55], [45, 48, 52], [41, 45, 48], [43, 47, 50]],
    melody: [[76, 0, 79, 0, 81, 79, 76, 0], [72, 0, 76, 0, 74, 0, 0, 0], [81, 0, 79, 0, 76, 0, 74, 0], [74, 0, 76, 0, 79, 0, 0, 0],
             [79, 0, 81, 0, 84, 81, 79, 0], [76, 0, 79, 0, 76, 74, 72, 0], [74, 0, 76, 0, 81, 0, 79, 0], [76, 0, 74, 0, 72, 0, 0, 0]] },
  room: { bpm: 66,
    chords: [[45, 48, 52], [41, 45, 48], [48, 52, 55], [43, 47, 50]],
    melody: [[76, 0, 0, 0, 74, 0, 72, 0], [69, 0, 0, 0, 0, 0, 0, 0], [72, 0, 74, 0, 76, 0, 0, 0], [79, 0, 76, 0, 74, 0, 0, 0],
             [81, 0, 79, 0, 76, 0, 0, 0], [74, 0, 72, 0, 69, 0, 0, 0], [72, 0, 0, 74, 76, 0, 0, 0], [74, 0, 0, 0, 0, 0, 0, 0]] }
};
const MUSIC = {
  on: true, mode: "map", step: 0, next: 0, timer: null, out: null,
  midi: m => 440 * Math.pow(2, (m - 69) / 12),
  bus() {
    const ctx = SFX.ctx; if (!ctx) return null;
    if (!this.out) {
      this.out = ctx.createGain(); this.out.gain.value = 0;
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2600;
      this.out.connect(lp).connect(ctx.destination);
    }
    return this.out;
  },
  bell(freq, t, vol) {
    const ctx = SFX.ctx, o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = freq; o2.type = "triangle"; o2.frequency.value = freq * 2;
    const g2 = ctx.createGain(); g2.gain.value = .15;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    o.connect(g); o2.connect(g2).connect(g); g.connect(this.out);
    o.start(t); o2.start(t); o.stop(t + 1.7); o2.stop(t + 1.7);
  },
  pad(notes, t, dur) {
    const ctx = SFX.ctx;
    notes.forEach(m => [0, 4].forEach(det => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = this.midi(m); o.detune.value = det;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.05, t + .9); g.gain.setValueAtTime(.05, t + dur - .6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + .4);
      o.connect(g).connect(this.out); o.start(t); o.stop(t + dur + .5);
    }));
  },
  schedule() {
    const ctx = SFX.ctx; if (!ctx || document.hidden) return;
    const song = SONGS[this.mode], eighth = 30 / song.bpm;
    if (this.next < ctx.currentTime) this.next = ctx.currentTime + .1;
    while (this.next < ctx.currentTime + .6) {
      const bar = Math.floor(this.step / 8) % song.melody.length, pos = this.step % 8;
      if (pos === 0) this.pad(song.chords[bar % song.chords.length], this.next, eighth * 8);
      const m = song.melody[bar][pos];
      if (m) this.bell(this.midi(m), this.next, this.mode === "room" ? .07 : .08);
      this.next += eighth; this.step++;
    }
  },
  start() {
    if (!this.on) return;
    SFX.init(); const out = this.bus(); if (!out || this.timer) return;
    const ctx = SFX.ctx;
    out.gain.cancelScheduledValues(ctx.currentTime); out.gain.setTargetAtTime(.55, ctx.currentTime, .8);
    this.next = ctx.currentTime + .15; this.timer = setInterval(() => this.schedule(), 150);
  },
  stop() {
    if (this.out && SFX.ctx) this.out.gain.setTargetAtTime(0, SFX.ctx.currentTime, .3);
    clearInterval(this.timer); this.timer = null;
  },
  setMode(m) { if (this.mode === m) return; this.mode = m; this.step = 0; }
};
try { MUSIC.on = localStorage.getItem(MUSIC_KEY) !== "off"; } catch (e) {}

/* ============================================================

  mirrorChoice: `<svg class="diagram" viewBox="0 0 320 175" role="img" aria-label="An incident ray hits a plane mirror. Three possible reflected rays are labelled A, B and C">

    <line x1="160" y1="145" x2="160" y2="15" stroke="${NORM}" stroke-width="2" stroke-dasharray="6 5"/><text x="166" y="24" fill="${NORM}" font-size="12">normal</text>
    <line x1="50" y1="45" x2="160" y2="145" stroke="${RAY}" stroke-width="3"/>${arrowHead(110, 100, 42, RAY)}
    <g stroke="#5B8FC9" stroke-width="3"><line x1="160" y1="145" x2="195" y2="25"/><line x1="160" y1="145" x2="270" y2="45"/><line x1="160" y1="145" x2="300" y2="112"/></g>
    <text x="198" y="22" fill="${INK}" font-size="15" font-weight="800">A</text><text x="274" y="44" fill="${INK}" font-size="15" font-weight="800">B</text><text x="300" y="106" fill="${INK}" font-size="15" font-weight="800">C</text>
    <text x="20" y="172" fill="${INK}" font-size="12">plane mirror</text></svg>`,
  refractOut: `<svg class="diagram" viewBox="0 0 320 190" role="img" aria-label="A ray travels up through a glass block and reaches the top surface. Three possible paths in the air are labelled A, B and C">
    <rect x="20" y="95" width="280" height="85" fill="${GLASS}" stroke="${INK}" stroke-width="2"/>

    <line x1="160" y1="15" x2="160" y2="185" stroke="${NORM}" stroke-width="2" stroke-dasharray="6 5"/>
    <line x1="100" y1="175" x2="160" y2="95" stroke="${RAY}" stroke-width="3"/>${arrowHead(130, 135, -53, RAY)}
    <g stroke="#5B8FC9" stroke-width="3"><line x1="160" y1="95" x2="258" y2="48"/><line x1="160" y1="95" x2="214" y2="23"/><line x1="160" y1="95" x2="178" y2="22"/></g>
    <text x="262" y="48" fill="${INK}" font-size="15" font-weight="800">A</text><text x="217" y="20" fill="${INK}" font-size="15" font-weight="800">B</text><text x="170" y="16" fill="${INK}" font-size="15" font-weight="800">C</text></svg>`,
  convex: `<svg class="diagram" viewBox="0 0 320 165" role="img" aria-label="Rays parallel to the principal axis pass through a convex lens and meet at one point">
    <line x1="10" y1="80" x2="310" y2="80" stroke="${NORM}" stroke-width="1.5" stroke-dasharray="6 5"/>

    ${[40, 60, 100, 120].map(y => `<line x1="20" y1="${y}" x2="150" y2="${y}" stroke="${RAY}" stroke-width="2.5"/><line x1="150" y1="${y}" x2="240" y2="80" stroke="${RAY}" stroke-width="2.5"/>`).join("")}
    <line x1="20" y1="80" x2="240" y2="80" stroke="${RAY}" stroke-width="2.5"/>

  prism: `<svg class="diagram" viewBox="0 0 320 175" role="img" aria-label="White light enters a triangular prism and spreads into a spectrum; A is the top colour, B the bottom colour">
    <polygon points="150,20 90,150 210,150" fill="${GLASS}" stroke="${INK}" stroke-width="2"/>

    <text x="12" y="88" fill="${INK}" font-size="12">white light</text>
    ${["#e0473d", "#f28c28", "#f2c230", "#4caf50", "#3b7de0", "#4b3fb8", "#8e44c8"].map((c, i) => `<line x1="182" y1="${96 + i * 2}" x2="298" y2="${88 + i * 12}" stroke="${c}" stroke-width="3"/>`).join("")}
    <text x="303" y="92" fill="${INK}" font-size="13" font-weight="700">A</text><text x="303" y="164" fill="${INK}" font-size="13" font-weight="700">B</text></svg>`
};

/* ============================================================
   4. Chapter 14 "Light, Colours and Beyond": 7 topics = 7 escape rooms.
   Concept-only content: no calculations anywhere.
   Puzzle types: mc (choices) and dial (combination dials, optional labels).
   Each room: 5 hotspots (bookshelf, wall clock, special, locked box, safe) + exit door.
   ============================================================ */
const HOTSPOTS = [
  { name: "Bookshelf", x: 15, y: 50, item: "card", itemName: "Code card", line: "A book is glowing on the shelf... there's a question inside!" },
  { name: "Wall clock", x: 37.5, y: 20, item: "hand", itemName: "Clock hand", line: "The clock has stopped. A riddle is written on its face." },
  { name: "", x: 55, y: 55, item: "orb", itemName: "", line: "" },
  { name: "Locked box", x: 38, y: 86, item: "key", itemName: "Small key", line: "A cute locked box with a lock on it!" },

/* Save code: 5 characters of Crockford base32 (no I, L, O, U) = 25 bits.

const B32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";

  return ((s0 % m) + m) % m;
}
const CODE_KINV = modInv(CODE_K, CODE_M);
function roomStars(r) {
  if (!S.completed_rooms.includes(r.id)) return 0;
  if (S.room_stars[r.id]) return S.room_stars[r.id];
  const n = r.puzzles.filter((_, i) => S.mastered_puzzles.includes(`${r.id}-${i}`)).length;
  return n === 5 ? 3 : n >= 3 ? 2 : 1;
}
function makeCode() {
  let a = 0;

  const ni = nextRoomIndex();
  const lock = ni === -1 ? 0 : Math.min(5, (S.room_progress[ROOMS[ni].id] || []).length);
  const streak = Math.max(1, Math.min(79, S.current_streak));
  const shields = Math.max(0, Math.min(3, S.streak_shields));
  const n = a + 16384 * (lock + 6 * (streak + 80 * shields));
  let x = (n * CODE_K) % CODE_M, out = "";

}

// Daily streak: same day → no change; next day → +1; missed days → shields cover them, else restart at 1.
function checkIn() {
  const t = today();
  if (S.last_login_date !== t) S.stats.days += 1;
  if (!S.last_login_date) { S.current_streak = 1; streakNote = "🔥 Day 1 of your streak!"; }
  else if (S.last_login_date !== t) {
    const gap = dayNum(t) - dayNum(S.last_login_date);
    if (gap === 1) { S.current_streak += 1; streakNote = `🔥 Streak up! ${S.current_streak} days in a row.`; }
    else if (gap > 1) {
      const missed = gap - 1;
      if (S.streak_shields >= missed) { S.streak_shields -= missed; S.current_streak += 1; streakNote = `🛡️ Hachiware used ${missed} shield${missed > 1 ? "s" : ""} to protect your streak! Now ${S.current_streak} days.`; }
      else { S.current_streak = 1; streakNote = "🌱 Welcome back! Your streak restarted at 1."; }
    }
    if (S.current_streak % 7 === 0 && S.streak_shields < 3) { S.streak_shields += 1; streakNote += " 🛡️ 7-day milestone: +1 shield!"; }
  }
  S.longest_streak = Math.max(S.longest_streak || 0, S.current_streak);
  S.last_login_date = t;

}

  return `<div class="trophy ${got ? "got" : "locked"}" aria-label="${esc(t.name)}: ${got ? "unlocked" : `locked, ${v} of ${goal}`}">
    ${trophySvg(t, got)}

          : `<div class="pbar"><i style="width:${Math.round(100 * v / goal)}%"></i></div><span class="pnum">${v} / ${goal}</span>`}
  </div>`;
}
function cabinetHtml() {
  const n = TROPHIES.filter(t => S.trophies[t.id]).length;

function checkTrophies() {
  if (!S) return;
  TROPHIES.forEach(t => {
    if (S.trophies[t.id]) return;
    const [cur, goal] = t.prog();
    if (cur >= goal) { S.trophies[t.id] = today(); trophyQueue.push(t); }

}
function showTrophyBanner() {
  if (document.querySelector(".tbanner") || !trophyQueue.length) return;
  const t = trophyQueue.shift();
  const d = document.createElement("button"); d.className = "tbanner"; d.setAttribute("aria-live", "polite");
  d.innerHTML = `${trophySvg(t, true)}<span style="text-align:left"><span class="kicker" style="padding:0">Trophy unlocked!</span><br><b>${esc(t.name)}</b><br><span class="small">${esc(t.desc)}</span></span>`;
  const done = () => { d.remove(); setTimeout(showTrophyBanner, 300); };
  d.onclick = () => { SFX.tap(); done(); };
  document.body.appendChild(d);

}

function openModal(html, { wide = false, closable = true, onClose = null } = {}) {
  $modal.innerHTML = `<div class="overlay" id="ov"><div class="modal ${wide ? "wide" : ""}" role="dialog" aria-modal="true" id="mbox">
    ${closable ? `<button class="iconbtn x" id="mx" aria-label="Close">✕</button>` : ""}${html}</div></div>`;
  const close = () => { closeModal(); onClose && onClose(); };
  if (closable) {
    document.getElementById("mx").onclick = () => { SFX.tap(); $modal._close && $modal._close(); };
    document.getElementById("ov").onclick = e => { if (e.target.id === "ov" && $modal._close) $modal._close(); };
  }
  $modal._close = closable ? close : null;
  const f = $modal.querySelector(".modal button:not(.x), .modal input"); if (f) f.focus({ preventScroll: true });
  return document.getElementById("mbox");
}
function closeModal() { $modal.innerHTML = ""; $modal._close = null; }
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($journal.innerHTML) { $journal.innerHTML = ""; return; }

});

/* ----- Study Journal / Textbook Helper ----- */
function openJournal(roomId, highlight = []) {
  let rid = roomId || (R ? R.room.id : (ROOMS[S ? Math.max(0, nextRoomIndex()) : 0]).id);
  const draw = () => {
    const r = ROOMS[roomIndex(rid)];
    const terms = [], seen = new Set();
    r.puzzles.forEach(p => (p.terms || []).forEach(t => { if (!seen.has(t[0])) { seen.add(t[0]); terms.push(t); } }));
    $journal.innerHTML = `<div class="overlay top" id="jov"><div class="modal wide" role="dialog" aria-modal="true" aria-label="Study Journal">
      <button class="iconbtn x" id="jx" aria-label="Close journal">✕</button>
      <span class="kicker">📓 Study Journal · Chapter 14: Light, Colours and Beyond</span>
      <h2>Topic ${r.topicNo}: ${esc(r.topic)} <span class="zh">${r.zh}</span></h2>
      <div class="tabs" role="tablist">${ROOMS.map(x => `<button class="tab" role="tab" aria-selected="${x.id === rid}" data-t="${x.id}">T${x.topicNo} ${x.zh}</button>`).join("")}</div>
      <section class="jsec"><h3>📖 Summary 重點</h3><ul>${r.notes.map(n => `<li>${n}</li>`).join("")}</ul></section>
      <section class="jsec"><h3>🧭 Key rules 重點規則</h3>${r.rules.map(f => `<div class="formula">${esc(f)}</div>`).join("")}</section>
      <section class="jsec"><h3>🔤 Key terms 關鍵詞</h3><table class="tterms"><tbody>
        ${terms.map(([en, zh]) => `<tr class="${highlight.includes(en) ? "hl" : ""}"><td>${esc(en)}</td><td class="zh">${zh}</td></tr>`).join("")}</tbody></table>
        ${highlight.length ? `<p class="small muted">Highlighted terms are used in the puzzle you're on.</p>` : ""}</section>
    </div></div>`;
    document.getElementById("jx").onclick = () => { SFX.tap(); $journal.innerHTML = ""; };
    document.getElementById("jov").onclick = e => { if (e.target.id === "jov") $journal.innerHTML = ""; };
    $journal.querySelectorAll(".tab").forEach(b => b.onclick = () => { SFX.tap(); rid = b.dataset.t; highlight = []; draw(); });
    document.getElementById("jx").focus({ preventScroll: true });
  };
  draw();
}

    <div id="codeMsg" style="display:grid;gap:10px"></div>`);
  const copy = async (text, el, ok) => {
    try { await navigator.clipboard.writeText(text); toast(ok); }
    catch (e) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected. Press copy on your device."); }
  };
  document.getElementById("cpCode").onclick = () => copy(code, $modal.querySelector(".codebox"), `Code ${code} copied 📋`);

}

    case "prism": return `<path d="M440 196 L486 300 H394 Z" fill="#D3E4FF" ${o}/>${["#e0473d", "#f28c28", "#f2c230", "#4caf50", "#3b7de0", "#8e44c8"].map((c, i) => `<path d="M468 256 L540 ${214 + i * 10}" stroke="${c}" stroke-width="4"/>`).join("")}`;

    const show = () => (document.getElementById("kd").textContent = v || "_");
    const press = k => { if (done) return; SFX.beep(); if (k === "⌫") v = v.slice(0, -1); else if (v.length < 7 && !(k === "." && v.includes("."))) v += k; show(); };

}
function miss(box) {

    <div class="keypad"><div class="kdisplay"><span id="kd">_</span></div>
    <div class="keys">${["7", "8", "9", "4", "5", "6", "1", "2", "3", "", "0", "⌫"].map(k => k ? `<button class="key ${k === "⌫" ? "del" : ""}" data-k="${k}" aria-label="${k === "⌫" ? "Delete" : k}">${k}</button>` : "<span></span>").join("")}</div>
    <button class="btn" id="kok" style="width:min(208px,100%)">Open the door 🔓</button></div>
    <div id="pfb"></div>`);
  let v = "";
  const show = () => (document.getElementById("kd").textContent = v || "_");
  const press = k => { SFX.beep(); if (k === "⌫") v = v.slice(0, -1); else if (v.length < 5) v += k; show(); };
  box.querySelectorAll(".key").forEach(b => b.onclick = () => press(b.dataset.k));
  const ok = () => {
    if (v === room.code) { closeModal(); escapeRoom(); }
    else { SFX.wrong(); box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake"); v = ""; show(); document.getElementById("pfb").innerHTML = say("chiikawa", "Wah... wrong code! Type the digits in order #1 → #5. 🎒", "cry"); }
  };
  document.getElementById("kok").onclick = ok;
  box.onkeydown = e => { if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === "Backspace") press("⌫"); else if (e.key === "Enter") { e.preventDefault(); ok(); } };
}
function escapeRoom() {
  const { room } = R;
  stopTimer(); clearTimeout(R.introT);
  const tLeft = S.room_timer[room.id], used = ROOM_SECONDS - tLeft;
  const first = !S.completed_rooms.includes(room.id);
  if (first) { S.completed_rooms.push(room.id); S.chiikawa_badges.push(room.badge); S.inventory.push(room.item); }
  const run = S.room_run[room.id] || freshRun();
  const n = run.firsts.length, base = n === 5 ? 3 : n >= 3 ? 2 : 1;
  const lost = run.strikes >= 6 ? 2 : run.strikes >= 3 ? 1 : 0;
  const stars = Math.max(1, base - lost);
  S.room_stars[room.id] = Math.max(S.room_stars[room.id] || 0, stars);
  if (!first) S.stats.replays += 1;
  if (tLeft >= 0 && run.strikes === 0) S.stats.cleanEscapes += 1;
  if (!run.hints) S.stats.noHintEscapes += 1;
  S.room_run[room.id] = freshRun();
  S.room_timer[room.id] = ROOM_SECONDS;
  const ni = nextRoomIndex(); S.current_room = ni === -1 ? room.id : ROOMS[ni].id;
  recomputeMastery(); save(true);
  SFX.door();
  document.getElementById("doorG").classList.add("door-open");
  setMood("happy"); setLine("usagi", "YAHA!!! The door is opening!!! 🐰🎊", "happy");
  setTimeout(() => {
    SFX.fanfare(); confetti(180); yaha("Yaha!!");
    openModal(`
      <span class="kicker">Escaped! · Topic ${room.topicNo}</span>
      <h2>🎉 You escaped ${esc(room.name)}!</h2>
      <div class="cast" style="margin:0">${["usagi", "chiikawa", "hachiware"].map(w => `<div class="fig" style="width:90px">${figure(w, "happy")}</div>`).join("")}</div>
      <div class="row" style="justify-content:center;font-size:1.8rem" aria-label="${stars} of 3 stars">${starStr(stars)}</div>
      <p style="text-align:center"><b>${n}/5</b> locks on the first try · ⏱️ ${fmt(Math.max(0, used))}${tLeft < 0 ? " (overtime)" : ""} · ⚠️ ${run.strikes} strike${run.strikes === 1 ? "" : "s"}</p>
      ${lost ? `<div class="rules">Guess strikes cost you <b>${lost} star${lost > 1 ? "s" : ""}</b> this time. Replay the room and think before answering to win them back!</div>` : ""}
      ${first ? say("momonga", `You earned <b>${esc(room.badge)}</b> and <b>${esc(room.item)}</b>! 💜`, "happy") : say("kurimanju", "Replay complete. Practice makes the brain strong. 🍵", "happy")}
      <section class="card cream jsec"><h3>📖 Textbook recap: ${esc(room.topic)} <span class="zh">${room.zh}</span></h3><ul>${room.notes.map(x => `<li>${x}</li>`).join("")}</ul></section>
      ${say("hachiware", ni === -1 ? "That was the final room. You've mastered Light! 🌟" : `That's today's mission done! 🌱 Next time: <b>Topic ${ROOMS[ni].topicNo}: ${esc(ROOMS[ni].topic)}</b>.`, "happy", "hint")}
      <div class="row"><button class="btn big" id="eMap">Back to the map</button><button class="btn yellow" id="eCode">🔑 Get my save code</button></div>`, { onClose: renderMap });
    document.getElementById("eMap").onclick = () => { SFX.tap(); closeModal(); renderMap(); };
    document.getElementById("eCode").onclick = () => { SFX.tap(); renderMap(); openSaveModal(); };
    setTimeout(checkTrophies, 1800);
  }, reduced() ? 100 : 1000);
}

/* ============================================================
   10. Boot: save-code links (#CODE), resume prompt, or new game
   ============================================================ */
document.getElementById("home").onclick = () => { if (S) { SFX.init(); SFX.tap(); closeModal(); renderMap(); } };
document.addEventListener("pointerdown", () => { SFX.init(); MUSIC.start(); }, { once: true });
document.addEventListener("keydown", () => { SFX.init(); MUSIC.start(); }, { once: true });
document.addEventListener("visibilitychange", () => { if (document.hidden && S) save(); });
window.addEventListener("pagehide", () => { if (S) save(); });
(function boot() {
  const linked = decodeCode(location.hash.slice(1));
  if (linked) { S ? renderMap() : renderWelcome(); showCodeFromLink(linked); return; }
  if (S) { checkIn(); renderMap(); showResume(); } else renderWelcome();
})();
</script>
